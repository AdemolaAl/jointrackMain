<style>
/* stage (illustration) */
.stage{position:relative;width:100%;max-width:600px;aspect-ratio:1/1;margin-inline:auto;container-type:inline-size}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.stage .back{z-index:0}.stage .person{z-index:2}
.orb{position:absolute;left:0;top:0;width:clamp(36px,8.4cqw,50px);height:clamp(36px,8.4cqw,50px);margin:calc(clamp(36px,8.4cqw,50px)/-2) 0 0 calc(clamp(36px,8.4cqw,50px)/-2);border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35);will-change:transform;z-index:3}
.orb svg{width:56%;height:56%}
.orb i{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);font:600 10.5px/1 var(--f);font-style:normal;color:#CFCBEA;white-space:nowrap;letter-spacing:.01em}
.o-meta{background:linear-gradient(160deg,#2E86FF,#0559E3)}
.o-tt{background:#0B0B12;border:1px solid rgba(255,255,255,.14)}
.o-snap{background:#FFFC00}
.o-tg{background:linear-gradient(160deg,#3CC0FF,#1E96D8)}
.hcards{position:absolute;inset:0;z-index:4;pointer-events:none}
.hc{--w:clamp(200px,54cqw,300px);position:absolute;left:clamp(6px,var(--x),calc(100% - var(--w) - 6px));top:var(--y);width:var(--w);display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(22,20,40,.66);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 18px 40px -16px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);color:#fff;
  animation:hcIn 5.6s cubic-bezier(.2,.8,.2,1) forwards;opacity:0}
.hc .a{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.hc b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hc small{display:block;font-size:11.5px;color:#AFACCB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hc small em{font-style:normal;font-weight:600}
.hc .s{font:600 11px/1 var(--f);padding:6px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.hc .s i{width:6px;height:6px;border-radius:50%;background:currentColor}
@keyframes hcIn{
  0%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.35)}
  14%{opacity:1;transform:translate(0,0) scale(1.02)}
  20%{transform:translate(0,0) scale(1)}
  82%{opacity:1;transform:translate(0,-6px)}
  100%{opacity:0;transform:translate(0,-26px) scale(.97)}}
/* svg character animation */
.breathe{transform-origin:260px 384px;animation:breathe 5.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-2px) scale(1.012,1.016)}}
.headg{transform-origin:260px 216px;animation:nod 8s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg) translateY(1px)}}
.arm-l{animation:tap .32s ease-in-out infinite alternate}
.arm-r{animation:tap .32s ease-in-out infinite alternate-reverse}
@keyframes tap{to{transform:translateY(-2.2px)}}
.leaf{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.leaf:nth-child(2){animation-delay:-2s}.leaf:nth-child(3){animation-delay:-4s}
@keyframes sway{50%{transform:rotate(4deg)}}
.steam path{stroke-dasharray:6 40;animation:steam 3.2s linear infinite}
.steam path:nth-child(2){animation-delay:-1.6s}
@keyframes steam{from{stroke-dashoffset:46;opacity:0}30%{opacity:.8}to{stroke-dashoffset:0;opacity:0}}
.lidglow{transform-origin:260px 341px;animation:lid 1.8s ease-in-out infinite}
@keyframes lid{50%{opacity:.45;transform:scale(.9)}}
.spark{animation:twinkle 4s ease-in-out infinite}
.spark:nth-of-type(2n){animation-delay:-1.3s}.spark:nth-of-type(3n){animation-delay:-2.6s}
@keyframes twinkle{50%{opacity:.15}}
.ringdash{stroke-dasharray:3 9;animation:ring 40s linear infinite}
@keyframes ring{to{stroke-dashoffset:-480}}

@container (max-width:440px){.hc{--w:min(66cqw,260px);padding:7px 9px;gap:8px}.hc b{font-size:12.5px}.hc small{font-size:11px}}
</style>

      <script>
      (function(){
        /* Illustration: orbiting platform badges + join/deposit cards that float out of the laptop. Pauses when off screen. */
        const stage=document.currentScript.closest('.stage'); if(!stage) return;
        const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
        const orbs=[...stage.querySelectorAll('.orb')], hc=stage.querySelector('.hcards');
        const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        let on=true, ang=.35, last=performance.now();
        function place(){
          const w=stage.clientWidth, h=stage.clientHeight, cx=w*.5, cy=h*(322/520), rx=w*(236/520), ry=h*(64/520);
          orbs.forEach((o,i)=>{ const a=ang+i*Math.PI/2, s=Math.sin(a), sc=.78+.22*(s+1)/2;
            o.style.transform=`translate(${(cx+Math.cos(a)*rx).toFixed(1)}px,${(cy+s*ry).toFixed(1)}px) scale(${sc.toFixed(3)})`;
            o.style.zIndex=s>0?3:1; o.style.opacity=s>0?1:(.55+.45*(s+1)).toFixed(2); });
        }
        function loop(t){ if(!on) return; const dt=Math.min(50,t-last); last=t; ang+=dt*.00022; place(); requestAnimationFrame(loop); }
        new IntersectionObserver(([e])=>{ on=e.isIntersecting; if(on&&!RM){ last=performance.now(); requestAnimationFrame(loop); } }).observe(stage);
        place(); addEventListener('resize',place);
        const PL={meta:['Meta','#0866FF','rgba(8,102,255,.22)','#9DBEFF'],tiktok:['TikTok','#FE2C55','rgba(254,44,85,.2)','#FF9AAE'],snap:['Snapchat','#FFFC00','rgba(255,252,0,.15)','#FFFA8A']};
        const AV=['#6A4BFF','#E0609A','#12B886','#2AABEE','#F2A93B','#C14BFF','#0866FF','#FE2C55'];
        const FEED=[
          {n:'Omar',t:'join',c:'Daily Deals Club',src:'TikTok ad',p:'tiktok',s:'9s'},
          {n:'Lucas',t:'ftd',amt:'$120',p:'meta',ev:'Purchase'},
          {n:'Sofia',t:'join',c:'Fit in 30',src:'Snapchat ad',p:'snap',s:'14s'},
          {n:'Noah',t:'join',c:'Creator Studio',src:'Instagram ad',p:'meta',s:'6s'},
          {n:'Aisha',t:'reg',c:'Travel Hacks',p:'tiktok'},
          {n:'Mateo',t:'bot',c:'Recipe Box bot',src:'Facebook ad',p:'meta',s:'11s'},
          {n:'Yuki',t:'ftd',amt:'$80',p:'snap',ev:'PURCHASE'},
          {n:'Hannah',t:'join',c:'Startup Notes',src:'TikTok ad',p:'tiktok',s:'8s'},
          {n:'Ravi',t:'join',c:'Study Squad',src:'Snapchat ad',p:'snap',s:'12s'},
          {n:'Chloe',t:'ftd',amt:'$250',p:'tiktok',ev:'CompletePayment'}];
        const SLOTS=[{x:0,y:3},{x:47,y:16},{x:1,y:47},{x:46,y:60}];
        let fi=0, si=0;
        function card(force){
          if(!force&&(!on||document.hidden)) return;
          const NAR=stage.clientWidth<440, SL=NAR?[{x:0,y:1},{x:100,y:76}]:SLOTS;
          const d=FEED[fi%FEED.length], slot=SL[si++%SL.length], p=PL[d.p]; fi++;
          let title, sub;
          if(d.t==='ftd'){ title=`${d.n} · ${_t('First deposit')} ${d.amt}`; sub=`<em style="color:#5BE0B0">${d.ev} ${_t('sent to')} ${p[0]} ✓</em>`; }
          else { title=(d.t==='reg'?_t('[name] registered · [channel]'):d.t==='bot'?_t('[name] started [channel]'):_t('[name] joined [channel]')).replace('[name]',d.n).replace('[channel]',d.c);
            sub=`${_t('[platform] ad').replace('[platform]',d.t==='reg'?p[0]:d.src.replace(/ ad$/,''))} · <em style="color:${p[3]}">${_t('Sent to')} ${p[0]} ✓</em>`; }
          const el=document.createElement('div'); el.className='hc';
          const w=stage.clientWidth, h=stage.clientHeight, cw=Math.min(300,Math.max(200,w*.54));
          el.style.setProperty('--x',slot.x+'%'); el.style.setProperty('--y',slot.y+'%');
          el.style.setProperty('--fx',(w*.5-slot.x/100*w-cw/2).toFixed(0)+'px'); el.style.setProperty('--fy',(h*(341/520)-slot.y/100*h-26).toFixed(0)+'px');
          el.innerHTML=`<span class="a" style="background:${AV[fi%AV.length]}">${d.n[0]}</span><div><b>${esc(title)}</b><small>${sub}</small></div>`;
          hc.appendChild(el); if(!RM) setTimeout(()=>el.remove(),5800);
          while(hc.children.length>(NAR?2:4)) hc.firstChild.remove();
          return el;
        }
        if(RM){ for(let i=0;i<3;i++){ const el=card(true); el.style.animation='none'; el.style.opacity=1; } }
        else { setTimeout(()=>card(true),450); setTimeout(()=>card(true),1400); setInterval(card,1900); }
      })();
      </script>
