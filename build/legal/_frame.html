<style>
/*SHARED*/
/* Layout: a plain reading page in the former look. Light warm title band with soft violet glow, then a narrow column with clear headings. */
.hd{position:relative;overflow:hidden;isolation:isolate;padding-bottom:clamp(40px,6vw,64px);border-bottom:1px solid var(--line)}
.hd::before{content:"";position:absolute;width:560px;height:560px;right:-120px;top:-260px;z-index:-1;border-radius:50%;background:var(--lilac);filter:blur(80px);opacity:.9}
.hd::after{content:"";position:absolute;width:380px;height:380px;left:-120px;top:-120px;z-index:-1;border-radius:50%;background:var(--mint);filter:blur(80px);opacity:.6}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;height:72px}
.top nav{display:flex;gap:6px}
.top .login{background:transparent;border-color:transparent}
.hd h1{font-size:clamp(40px,6.4vw,70px);letter-spacing:-.05em;line-height:1;margin-top:12px;max-width:720px}
.hd .kick{display:block;margin-top:clamp(28px,5vw,48px)}
article{max-width:720px;margin:0 auto;padding:clamp(30px,5vw,56px) 0 64px}
article .upd{color:var(--muted);margin:0 0 30px;font-size:14px;font-family:var(--mono)}
article h1{display:none}
article h2{font-size:22px;letter-spacing:-.03em;margin:36px 0 10px}
article p,article li{color:var(--muted);font-size:16.5px;line-height:1.7}
article b{color:var(--ink);font-weight:700}
article a{color:var(--brand-text)}
article ul{padding-left:20px}
article li{margin:4px 0}
footer{padding:26px 0 40px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);max-width:720px;margin:0 auto}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--ink)}
@media (max-width:480px){.top .blogl{display:none}}
@media (max-width:420px){.top .btn{padding:9px 14px;font-size:14px}.top .logo{font-size:19px}.top .mark{width:34px;height:34px}}
.hd .by{margin:12px 0 0;color:var(--muted);font-size:16px}.hd .by b{color:var(--ink)}
.hub{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;max-width:820px}
.hub a{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;transition:color .2s,border-color .2s}
.hub a:hover{color:var(--ink);border-color:color-mix(in srgb,#5b3df5 35%,var(--line))}
.hub a[aria-current="page"]{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:var(--ink-btn)}
footer .fl{display:flex;flex-wrap:wrap;gap:6px 16px}
article code{font:500 .85em var(--mono);background:var(--sunk);padding:2px 6px;border-radius:6px}
@media (max-width:560px){.hub{flex-wrap:nowrap;overflow-x:auto;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}.hub::-webkit-scrollbar{display:none}.hub a{white-space:nowrap}}
</style>

  <div class="top"><a class="logo" href="{{HOME}}">{{LOGO}}Joinvoo</a><nav><a class="btn sm login blogl" href="{{BLOG}}">Blog</a><div class="lsw" data-lsw></div><a class="btn sm login" href="{{LOGIN}}">Log in</a><a class="btn sm violet" href="{{SIGNUP}}">Start free</a></nav></div>

</div></header>

<article data-noi18n>__BODY__</article>
<footer><span>© Joinvoo · By Zedapex company</span><span class="fl"><a href="{{HOME}}">Home</a><a href="{{GUIDE}}">Guide</a><a href="{{BLOG}}">Blog</a><a href="{{TERMS}}">Terms</a><a href="{{PRIVACY}}">Privacy</a><a href="{{REFUNDS}}">Refunds</a><a href="{{AUP}}">Acceptable use</a><a href="{{COOKIES}}">Cookies</a><a href="{{REFTERMS}}">Referral terms</a></span>{{VOOFOOT}}</footer>
