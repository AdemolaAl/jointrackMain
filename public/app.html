const botUser = c => String(c.title||'').replace(/^@/,'') || 'your_bot';
function snippets(c){
  const hs=c.hook_start||'', hb=c.hook_blocked||'', u=botUser(c);
  const node=`// grammY: runs when someone presses Start
bot.command("start", async (ctx) => {
  const q = new URLSearchParams({
    bot: "${u}",
    start: ctx.match || "",               // the code after /start
    tg_id: String(ctx.from.id),
    first_name: ctx.from.first_name || "",
    last_name: ctx.from.last_name || "",
    username: ctx.from.username || "",
    lang: ctx.from.language_code || "",
  });
  fetch("${hs}?" + q).catch(() => {});  // don't wait, never breaks your bot
  // ...your usual welcome reply
});
// Telegraf: bot.start((ctx) => …) and use ctx.payload instead of ctx.match`;
  const py=`# python-telegram-bot: runs when someone presses Start
import httpx
HOOK = "${hs}"

async def start(update, context):
    u = update.effective_user
    payload = context.args[0] if context.args else ""   # the code after /start
    try:
        async with httpx.AsyncClient(timeout=5) as c:
            await c.get(HOOK, params={
                "bot": "${u}", "start": payload, "tg_id": u.id,
                "first_name": u.first_name or "", "last_name": u.last_name or "",
                "username": u.username or "", "lang": u.language_code or ""})
    except Exception:
        pass
    # ...your usual welcome reply

# aiogram 3: @dp.message(CommandStart()) and use command.args for the payload`;
  const php=`<?php
// Inside your webhook handler: when the message starts with /start
$m = $update['message'] ?? [];
$text = $m['text'] ?? '';
if (strpos($text, '/start') === 0) {
  $q = http_build_query([
    'bot'        => '${u}',
    'start'      => trim(substr($text, 6)),   // the code after /start
    'tg_id'      => $m['from']['id'],
    'first_name' => $m['from']['first_name'] ?? '',
    'last_name'  => $m['from']['last_name'] ?? '',
    'username'   => $m['from']['username'] ?? '',
    'lang'       => $m['from']['language_code'] ?? '',
  ]);
  @file_get_contents('${hs}?' . $q);
}`;
  const nc=`${hs}?bot=${u}&tg_id={user id}&start={start parameter}&first_name={first name}`;
  const T=[['node','Node.js'],['py','Python'],['php','PHP'],['nc','No-code bot builder']];
  const pane=(k,code)=>`<div class="snip-pane" data-pane="${k}" ${k==='node'?'':'hidden'}><div class="codewrap"><pre class="codeblock">${esc(code)}</pre><button class="btn sm" data-act="copy" data-v="${esc(code)}">${I.copy} Copy</button></div></div>`;
  return `<div class="snips"><div class="utabs snip-tabs" role="tablist">${T.map(([k,l],i)=>`<button role="tab" data-act="snip" data-k="${k}" aria-selected="${!i}">${l}</button>`).join('')}</div>
    ${pane('node',node)}${pane('py',py)}${pane('php',php)}
    <div class="snip-pane" data-pane="nc" hidden><ol class="howto" style="margin-bottom:12px">
      <li><span class="n">1</span><span>Open the <b>Start</b> step (the flow that runs when someone presses Start).</span></li>
      <li><span class="n">2</span><span>Add an <b>HTTP request</b> or <b>Webhook</b> block at the top. Method: <b>GET</b>.</span></li>
      <li><span class="n">3</span><span>Paste the URL below, then swap each <b>{…}</b> for your builder’s variable (user ID, start parameter, first name). The names differ per builder.</span></li>
      <li><span class="n">4</span><span>Save, then tap <b>Send a test</b> below or open your ad link on your phone.</span></li></ol>
      <div class="codewrap"><pre class="codeblock">${esc(nc)}</pre><button class="btn sm" data-act="copy" data-v="${esc(nc)}">${I.copy} Copy</button></div></div></div>`;
}

async function hookTest(a){

    if (DEMO){ await new Promise(f=>setTimeout(f,700)); r={ok:true,duplicate:false,from_ad:false}; }
    else { const q=new URLSearchParams({bot:a.dataset.b,tg_id:'1000000001',start:'test',first_name:'Test',username:'joinvoo_test'});
      const x=await fetch(a.dataset.u+'?'+q,{method:'GET'}); r=await x.json().catch(()=>({})); if(!x.ok||r.error) throw new Error(r.error||('The hook answered '+x.status)); }

function confetti(){
  if (reduced) return;
  const cv=$('#confetti'), ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1), w=innerWidth, h=innerHeight;
  cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#6A4BFF','#9C7CFF','#12B886','#F2A93B','#3BC9FF','#C14BFF'];
  const ps=Array.from({length:140},()=>({x:w/2+(Math.random()-.5)*120,y:h*.32,vx:(Math.random()-.5)*13,vy:-Math.random()*12-4,r:Math.random()*7+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let t=0; (function f(){ ctx.clearRect(0,0,w,h); t++;
    for(const p of ps){ p.vy+=.3; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-t/160); ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }
    if (t<160) requestAnimationFrame(f); else ctx.clearRect(0,0,w,h); })();
}

function niceMax(v){ if(v<=4) return 4; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p; return 10*p; }
function smooth(pts){ // monotone cubic (Fritsch–Carlson) → SVG path
  const n=pts.length; if(!n) return ''; if(n===1) return `M${pts[0][0]},${pts[0][1]}`;
  const dx=[],dy=[],m=[],t=[]; for(let i=0;i<n-1;i++){ dx[i]=pts[i+1][0]-pts[i][0]; dy[i]=pts[i+1][1]-pts[i][1]; m[i]=dy[i]/dx[i]; }
  t[0]=m[0]; t[n-1]=m[n-2]; for(let i=1;i<n-1;i++) t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(let i=0;i<n-1;i++){ if(m[i]===0){ t[i]=t[i+1]=0; continue; } const a=t[i]/m[i], b=t[i+1]/m[i], s=a*a+b*b; if(s>9){ const k=3/Math.sqrt(s); t[i]=k*a*m[i]; t[i+1]=k*b*m[i]; } }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){ const h=dx[i]/3; d+=`C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`; }
  return d;
}
function spark(vals, color){
  if (!vals || vals.length<2 || !vals.some(v=>v)) return '';
  const W=96,H=34, mx=Math.max(...vals), mn=Math.min(...vals), r=mx-mn||1, id='sg'+Math.random().toString(36).slice(2,8);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*W, H-3-(v-mn)/r*(H-8)]);
  const d=smooth(pts);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${W},${H}L0,${H}Z" fill="url(#${id})"/><path class="l" d="${d}" stroke="${color}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.5" fill="${color}"/></svg>`;
}
function buckets(series){
  const [f,t]=range(); const m=new Map(series.map(s=>[s.day,s])); const days=[];
  for (let d=parseYmd(f); ymd(d)<=t; d=addDays(d,1)){ const s=m.get(ymd(d))||{}; days.push({d:new Date(d),clicks:s.clicks||0,joins:s.joins||0,ftd:s.ftd||0}); }
  const mode=days.length<=62?'day':days.length<=200?'week':'month';
  if (mode==='day') return {mode,list:days.map(x=>({...x,label:x.d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}))};
  const out=[]; let cur=null;
  for (const x of days){ const key=mode==='week'?Math.floor((x.d-parseYmd(f))/(7*864e5)):x.d.getFullYear()*12+x.d.getMonth(); if(!cur||cur.key!==key){cur={key,d:x.d,clicks:0,joins:0,ftd:0};out.push(cur);} cur.clicks+=x.clicks; cur.joins+=x.joins; cur.ftd+=x.ftd; }
  out.forEach(b=>b.label=mode==='week'?'Week of '+b.d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):b.d.toLocaleDateString('en-US',{month:'long',year:'numeric'}));
  return {mode,list:out};
}

function drawPerf(el, series, anim){

  const H=T+H1+G+H2+B, iw=W-L-R, slot=iw/n, x=i=>L+slot*i+slot/2;
  const max=niceMax(Math.max(1,...list.map(b=>b.clicks))), y=v=>T+H1-v/max*H1;
  const fmax=Math.max(1,...list.map(b=>b.ftd)), fy0=T+H1+G+H2, fh=v=>v/niceMax(fmax)*H2;
  const cj=css('--c-join'), cc=css('--c-click'), cf=css('--c-ftd');

  for(const i of li) g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${n>1&&i===0&&slot<40?'start':n>1&&i===n-1&&slot<40?'end':'middle'}">${sl(list[i])}</text>`;

  list.forEach((b,i)=>{ const hc=b.clicks?Math.max(3,T+H1-y(b.clicks)):0, hj=b.joins?Math.max(3,T+H1-y(b.joins)):0, hf=b.ftd?Math.max(2,fh(b.ftd)):0;

    if(hj) g+=`<rect class="bar-j" x="${x(i)-bw/2}" y="${T+H1-hj}" width="${bw}" height="${hj}" rx="${rx}" fill="${cj}" ${st(i,120)}/>`;
    if(hf) g+=`<rect class="bar-f" x="${x(i)-bw/2}" y="${fy0-hf}" width="${bw}" height="${hf}" rx="${Math.min(rx,4)}" fill="${cf}" ${st(i,240)}/>`;
    g+='</g>'; });

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Clicks, joins and first deposits per ${mode}">${g}</svg>`;
  const svg=el.querySelector('svg'); let tip=null;
  const show=i=>{ const b=list[i];
    svg.querySelectorAll('g[data-g]').forEach(r=>r.style.opacity=r.dataset.g==i?1:.4);
    if(!tip){ tip=document.createElement('div'); tip.className='tip'; el.appendChild(tip); }
    tip.innerHTML=`<div class="th">${esc(b.label)}</div><div class="tr"><span><i style="background:${cc}"></i>Clicks</span><b>${fmt(b.clicks)}</b></div><div class="tr"><span><i style="background:${cj}"></i>Joins</span><b>${fmt(b.joins)}</b></div><div class="tr"><span><i style="background:${cf}"></i>First deposits</span><b>${fmt(b.ftd)}</b></div><div class="tf">Join rate ${pctS(b.joins,b.clicks)}${b.ftd?` · ${pctS(b.ftd,b.joins)} deposit`:''}</div>`;

/* Payment methods come from billing.pay_methods (admin-managed); old billing.methods is the fallback. */
function payMethods(b){
  b=b||{};
  if (Array.isArray(b.pay_methods)) return b.pay_methods.filter(m=>m&&m.enabled!==false&&m.id);
  const m=b.methods||{}, out=[];
  if (m.paystack) out.push({id:'paystack',type:'paystack',label:'Paystack',note:'Card, bank transfer or USSD'});
  if (m.flutterwave) out.push({id:'flutterwave',type:'flutterwave',label:'Flutterwave',note:'Card, mobile money (M-Pesa, MoMo) or bank'});
  if (m.crypto) out.push({id:'crypto',type:'crypto',label:'USDT (TRC20)',note:'Tether on the TRC20 network',currency:'USDT',address:b.usdt_address||''});
  return out;
}

function mIcon(m){
  const t=(m.type||m.provider||'').toLowerCase(), l=String(m.label||m.method_label||'').toLowerCase();
  if (t==='paystack'||/paystack/.test(l)) return ['PS','#E9F7F2','#0B8DBF'];
  if (t==='flutterwave'||/flutterwave/.test(l)) return ['FW','#FFF4E5','#D9751A'];
  if (t==='crypto'||/usdt|tether/.test(l)) return ['₮','#E3F8F0','#0A8A63'];
  if (/btc|bitcoin/.test(l)) return ['₿','#FFF1DE','#C96F00'];
  if (/eth|ether/.test(l)) return ['Ξ','#EEF0FF','#4A5BD6'];

let moneyAnim=null;
function moneyRain(cv){
  cancelAnimationFrame(moneyAnim); if (!cv || reduced) return;
  const ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
  const size=()=>{ const r=cv.getBoundingClientRect(); cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return r; };
  let R=size(); const items=[];
  const spawn=(y)=>items.push({ x:Math.random()*R.width, y:y??R.height+30, vy:.35+Math.random()*.6, sway:Math.random()*6.28, rot:Math.random()*6.28, vr:(Math.random()-.5)*.03, coin:Math.random()<.55, s:.7+Math.random()*.6, a:.3+Math.random()*.45 });
  for(let i=0;i<18;i++) spawn(Math.random()*R.height);
  const bill=(it)=>{ ctx.fillStyle='#8CEBC4'; ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=1.2; const w=34*it.s,h=18*it.s; ctx.beginPath(); ctx.roundRect?ctx.roundRect(-w/2,-h/2,w,h,3):ctx.rect(-w/2,-h/2,w,h); ctx.fill(); ctx.stroke(); ctx.fillStyle='#0A6E50'; ctx.font=`800 ${11*it.s}px Geist,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$',0,.5); };
  const coin=(it)=>{ const r=9*it.s; const g=ctx.createLinearGradient(-r,-r,r,r); g.addColorStop(0,'#FFE9A0'); g.addColorStop(1,'#E2A420'); ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,r*Math.abs(Math.cos(it.rot*2))+r*.25,r,0,0,6.283); ctx.fill(); };
  let last=0;
  (function f(t){ if(!cv.isConnected) return; if(t-last>16){ last=t; ctx.clearRect(0,0,R.width,R.height);
    for(let i=items.length-1;i>=0;i--){ const it=items[i]; it.y-=it.vy; it.sway+=.02; it.rot+=it.vr; const x=it.x+Math.sin(it.sway)*14;
      ctx.save(); ctx.globalAlpha=it.a*Math.min(1,(it.y+20)/60); ctx.translate(x,it.y); ctx.rotate(it.coin?0:it.rot); it.coin?coin(it):bill(it); ctx.restore();
      if(it.y<-30){ items.splice(i,1); spawn(); } } }
    moneyAnim=requestAnimationFrame(f); })(0);
  addEventListener('resize',()=>{ if(cv.isConnected) R=size(); },{once:true});
}
function countMoney(el,to){ const f2=v=>(v/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); if(reduced){ el.textContent=f2(to); return; } const t0=performance.now(); const f=n=>{ const p=Math.min(1,(n-t0)/1400), e=1-Math.pow(1-p,4); el.textContent=f2(to*e); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

    <details><summary>Which bot setup should I pick?</summary><p><b>New bot, or only used for this</b> (easiest): paste the token and Joinvoo runs the bot for you, with a welcome message and a button.</p><p><b>Let Joinvoo pass messages on</b>: your bot already runs on its own server. Joinvoo receives its messages, notes who pressed Start, and passes every message on to your server unchanged. Needs the token and your server’s address. Not for bots that fetch their own messages (“polling”).</p><p><b>Keep my token private (no token)</b>: your bot, or your bot builder, makes one small web request to Joinvoo when someone presses Start. Works with any server or builder, and your token never leaves you.</p></details>
    <details><summary>Can it handle a lot of traffic?</summary><p>Yes. Invite links are made ahead of time, so nobody waits. If they ever run out, people still get into your channel through a backup link; only those joins aren’t matched. For very big campaigns, add a second bot to the same channel.</p></details>
    <details><summary>Why does my ad platform show fewer events than Joinvoo?</summary><p>Ad platforms only count people they can match, and they remove duplicates. That’s normal. Check the match quality in Meta Events Manager, TikTok Events or Snap Events Manager.</p></details>
    <details><summary>How much does it cost?</summary><p>${creditsPricing(S.bill)} 1 credit = $0.01. Buy credits once and they cover the month.</p></details>
    <details><summary>What are credits, bonus credits and ranks?</summary><p>Credits pay for tracking: 1 credit = $0.01. Bigger top-ups add bonus credits, and promo codes can add more. Bonus credits are spent like normal credits. Your rank (Bronze, Silver, Gold, Platinum, Diamond) grows with your lifetime top-ups and unlocks perks like a discount on extra joins. <b>Credits can’t be withdrawn. Only referral earnings can.</b></p></details>
    <details><summary>What is request-to-join mode?</summary><p>For channels, turn on “Request-to-join + welcome message”. People tap Request to join, the bot lets them in instantly and sends your welcome message with your offer link. The link carries their Telegram ID (<span class="mono">{tg_id}</span>), so your affiliate program reports each deposit for that exact person and ad.</p></details>
    <details><summary>How do integrations work?</summary><p>Open Conversions → Integrations, pick your program or tracker and copy the ready postback URL. Some programs show “Check macros with your manager”: the link works, but confirm the macro names with them. Not listed? Use Custom postback.</p></details>
    <details><summary>How do I see cost per FTD and ROAS?</summary><p>On Campaigns, tap <b>Add spend</b> and enter what you spent per day and campaign, or paste a CSV from your ads manager. Joinvoo then shows spend, cost per join, cost per first deposit and ROAS next to each campaign.</p></details>
    <details><summary>What are “fake clicks filtered”?</summary><p>Clicks from bots, data centers, headless browsers or rapid repeats are flagged and left out of your join rate. Real people who join are never removed.</p></details>
    <details><summary>What happens when my wallet runs out?</summary><p>Your ads keep working and people still get into your channel. Joinvoo just stops tracking and sending events until you top up. A banner at the top tells you when this happens.</p></details>
    <details><summary>An ad review doesn’t like my link</summary><p>On the Channels page, switch “When someone taps your ad” to <b>Join page</b>. Visitors then see a simple page with a Join button instead of being sent straight to Telegram.</p></details>
    <details><summary>The bot says it needs permission</summary><p>In Telegram, open your channel → Administrators → your bot, and turn on “Invite users via link”.</p></details>
  </section>

const QR=(()=>{
  const ECC=[0,10,16,26,18,24,16,18,22,22,26], BLK=[0,1,1,1,2,2,4,4,4,5,5];

  const mul=(x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; };
  const div=d=>{ const r=new Array(d).fill(0); r[d-1]=1; let root=1; for(let i=0;i<d;i++){ for(let j=0;j<d;j++){ r[j]=mul(r[j],root); if(j+1<d) r[j]^=r[j+1]; } root=mul(root,2); } return r; };
  const rem=(data,dv)=>{ const r=dv.map(()=>0); for(const b of data){ const f=b^r.shift(); r.push(0); dv.forEach((c,i)=>r[i]^=mul(c,f)); } return r; };
  const align=v=>{ if(v===1) return []; const n=Math.floor(v/7)+2, step=Math.ceil((v*4+4)/(n*2-2))*2, r=[6]; for(let p=v*4+10;r.length<n;p-=step) r.splice(1,0,p); return r; };
  function encode(text){
    const bytes=[...new TextEncoder().encode(text)]; let v=1;
    for(;v<=10;v++){ const cap=Math.floor(raw(v)/8)-ECC[v]*BLK[v]; if(4+(v<10?8:16)+bytes.length*8<=cap*8) break; } if(v>10) throw new Error('QR: too long');
    const cap=Math.floor(raw(v)/8)-ECC[v]*BLK[v], bits=[]; const put=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length,v<10?8:16); bytes.forEach(b=>put(b,8)); put(0,Math.min(4,cap*8-bits.length)); put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap*8;p^=0xEC^0x11) put(p,8);
    const data=[]; for(let i=0;i<bits.length;i+=8) data.push(parseInt(bits.slice(i,i+8).join(''),2));
    const nb=BLK[v], el=ECC[v], rc=Math.floor(raw(v)/8), ns=nb-rc%nb, sl=Math.floor(rc/nb), dv=div(el), blocks=[]; let k=0;
    for(let i=0;i<nb;i++){ const d=data.slice(k,k+sl-el+(i<ns?0:1)); k+=d.length; const e=rem(d,dv); if(i<ns) d.push(0); blocks.push(d.concat(e)); }
    const cw=[]; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==sl-el||j>=ns) cw.push(b[i]); });
    const N=v*4+17, M=[...Array(N)].map(()=>Array(N).fill(false)), F=[...Array(N)].map(()=>Array(N).fill(false));
    const set=(x,y,d)=>{ M[y][x]=d; F[y][x]=true; };
    for(let i=0;i<N;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
    for(const [cx,cy] of [[3,3],[N-4,3],[3,N-4]]) for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy)); if(x>=0&&x<N&&y>=0&&y<N) set(x,y,d!==2&&d!==4); }
    const ap=align(v), L=ap.length-1; ap.forEach((a,i)=>ap.forEach((b,j)=>{ if((i===0&&j===0)||(i===0&&j===L)||(i===L&&j===0)) return; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }));
    const fmtBits=mask=>{ const d=(0<<3)|mask; let r=d; for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537); const b=(d<<10|r)^0x5412, g=i=>((b>>>i)&1)===1;
      for(let i=0;i<=5;i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9;i<15;i++) set(14-i,8,g(i));
      for(let i=0;i<8;i++) set(N-1-i,8,g(i)); for(let i=8;i<15;i++) set(8,N-15+i,g(i)); set(8,N-8,true); };
    fmtBits(0);
    if(v>=7){ let r=v; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=v<<12|r; for(let i=0;i<18;i++){ const d=((b>>>i)&1)===1, a=N-11+i%3, c=Math.floor(i/3); set(a,c,d); set(c,a,d); } }

  }

async function payReturn(){

/* counters: run when a scene becomes active; final values immediately with reduced motion */
function pzPlay(sc){
  if (!sc) return; (sc._pzT||[]).forEach(clearInterval); sc._pzT=[]; const T=sc._pzT;
  sc.classList.remove('on'); void sc.offsetWidth; sc.classList.add('on');
  const every=(ms,f)=>{ const id=setInterval(()=>{ if(!sc.isConnected||f()===false) clearInterval(id); },ms); T.push(id); };
  const tg=sc.querySelector('.pz-tg[data-climb]');
  if (tg){ const steps=[[1,1,1],[4,5,3],[15,18,14]], B=[...tg.querySelectorAll('.pz-badge')], tot=tg.querySelector('.pz-tot');
    const set=k=>{ steps[k].forEach((v,i)=>{ if(B[i]){ B[i].textContent=v; B[i].classList.remove('bump'); void B[i].offsetWidth; B[i].classList.add('bump'); } }); tot.textContent=steps[k].reduce((a,b)=>a+b,0); };
    if (reduced) set(2); else { let k=0; set(0); every(1000,()=>{ if(++k>2) return false; set(k); }); } }
  const tm=sc.querySelector('.pz-timer'); if (tm){ let m=182; const f=()=>{ tm.textContent=`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`; }; if(reduced){ m=201; f(); } else { f(); every(160,()=>{ m++; f(); if(m>=201) return false; }); } }
  sc.querySelectorAll('.pz-cnt').forEach(c=>{ const to=+c.dataset.to; if(reduced){ c.textContent=to; return; } let v=0; c.textContent=0; const st=Math.max(1,Math.round(to/24)); every(110,()=>{ v=Math.min(to,v+st); c.textContent=v; if(v>=to) return false; }); });
  const ans=sc.querySelector('.pz-tg.answered');
  if (ans && sc.classList.contains('pz-turn')){ const tot=ans.querySelector('.pz-tot'), sw=ans.querySelector('.pz-sw');
    if (reduced){ tot.textContent=0; sw.textContent='00:00:02'; } else { let n=47; tot.textContent=n; every(40,()=>{ n=Math.max(0,n-3); tot.textContent=n; if(!n) return false; }); let s=0; sw.textContent='00:00:00'; every(120,()=>{ s+=.12; sw.textContent='00:00:0'+Math.min(2,Math.floor(s)); if(s>=2) return false; }); } }
}
