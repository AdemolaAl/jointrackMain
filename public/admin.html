<title>Joinvoo Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Self-contained base (does not depend on shared.css): former Joinvoo look — Plus Jakarta Sans, warm off-white, pastel cards, pill buttons. */
:root{--bg:#fff;--surface:#fff;--sunk:#f6f5fb;--line:#ebe9f4;--ink:#1d1840;--muted:#625e7a;--faint:#8a87a0;
  --brand:#5b3df5;--brand-2:#8f7bff;--brand-soft:#efebff;--brand-text:#5b3df5;--ink-btn:#5b3df5;--ink-btn-fg:#fff;
  --mint-soft:#e8f3ec;--success-text:#2e7d57;--coral-soft:#fbeae8;--coral-text:#c2463f;--amber-soft:#fbf2df;--amber-text:#87631a;
  --sky:#ecf0fc;--sky-ink:#3d5ad6;--cream:#fbf2df;--cream-ink:#87631a;--lilac:#efebff;--lilac-ink:#5b3df5;
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root[data-jv="system"]{--bg:#110e22;--surface:#19152f;--sunk:#211c3b;--line:#2d2750;--ink:#f1effb;--muted:#aaa5c6;--faint:#8b86a8;
  --brand:#6f55ff;--brand-2:#a596ff;--brand-soft:#221b47;--brand-text:#b2a6ff;--ink-btn:#7c63ff;--ink-btn-fg:#fff;
  --mint-soft:#142a1e;--success-text:#5cc48c;--coral-soft:#331916;--coral-text:#ff8a80;--amber-soft:#2b2414;--amber-text:#e6b866;
  --sky:#19203d;--sky-ink:#93a6ff;--cream:#2b2414;--cream-ink:#e6b866;--lilac:#221b47;--lilac-ink:#b2a6ff;color-scheme:dark}}
:root[data-jv="dark"]{--bg:#110e22;--surface:#19152f;--sunk:#211c3b;--line:#2d2750;--ink:#f1effb;--muted:#aaa5c6;--faint:#8b86a8;
  --brand:#6f55ff;--brand-2:#a596ff;--brand-soft:#221b47;--brand-text:#b2a6ff;--ink-btn:#7c63ff;--ink-btn-fg:#fff;
  --mint-soft:#142a1e;--success-text:#5cc48c;--coral-soft:#331916;--coral-text:#ff8a80;--amber-soft:#2b2414;--amber-text:#e6b866;
  --sky:#19203d;--sky-ink:#93a6ff;--cream:#2b2414;--cream-ink:#e6b866;--lilac:#221b47;--lilac-ink:#b2a6ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.035em}
button,input,select,textarea{font:inherit;color:inherit}
/* Keep text-entry controls at 16px to prevent iOS Safari from zooming on focus. */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="image"]):not([type="hidden"]):not([type="color"]),textarea,select{font-size:16px!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}

/* Admin console. Own styles below override shared.css so the web pages can change freely.
   Layout: sticky glass top bar with tabs (badges on what needs action); each tab is a card list. Support is a two-pane inbox (list → conversation on phones). */
.adm{--ok:#12B886;--okt:var(--success-text,#0A7E5C);--bad:#F04E5E;--badt:var(--coral-text,#C2283A);--warn:var(--amber-text,#8A5A0B);
  --sh1:0 1px 2px rgba(18,14,48,.05);--sh3:0 2px 6px rgba(18,14,48,.06),0 24px 60px -18px rgba(30,20,90,.28);--ease:cubic-bezier(.2,.8,.2,1);
  font:400 14.5px/1.5 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.adm *{box-sizing:border-box}
.adm h1{font-size:clamp(24px,3vw,30px);font-weight:700;letter-spacing:-.035em;margin:0 0 4px}
.adm .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;letter-spacing:-.01em;word-break:break-all}
.adm .btn{--bh:36px;min-height:var(--bh);height:var(--bh);padding:0 14px;border-radius:10px;font:550 13.5px/1 "Plus Jakarta Sans",system-ui,sans-serif;box-shadow:var(--sh1);transform:none}
.adm .btn:hover{transform:none;border-color:color-mix(in srgb,var(--ink) 18%,var(--line))}
.adm .btn.sm{--bh:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.adm .btn.primary{background:var(--brand);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand) 70%,transparent)}
.adm .btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.adm .btn.no{color:var(--badt)}
.adm .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.adm .btn[disabled]{opacity:.5;pointer-events:none}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:16px;padding:12px 24px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.alogo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.045em;text-decoration:none;color:var(--ink)}
.alogo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#7C61FF,#5A3BF0);display:grid;place-items:center}
.alogo .mark svg{width:19px;height:19px}
.alogo small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text);background:var(--brand-soft);padding:3px 7px;border-radius:6px}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%;padding:3px;border-radius:12px;background:var(--sunk);border:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:9px;font:550 13.5px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.tabs .dot{min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.amain{max-width:1280px;margin:0 auto;padding:26px 24px 80px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:var(--sh1);text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer;transition:border-color .2s,box-shadow .2s}
button.kpi:hover{border-color:color-mix(in srgb,var(--ink) 16%,var(--line))}
.kpi .v{font-size:25px;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi.hot{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));background:linear-gradient(180deg,var(--coral-soft),var(--surface))}.kpi.hot .v{color:var(--badt)}
.kpi.good .v{color:var(--okt)}
.kpi.vio{background:linear-gradient(180deg,var(--brand-soft),var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}.kpi.vio .v{color:var(--brand-text)}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh1);min-width:0}
.acard h2{font-size:15px;font-weight:600;letter-spacing:-.015em;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.chart2{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:10px}
.chart2 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end;min-width:0}
.chart2 i{display:block;width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--brand-2),var(--brand));min-height:3px;transform-origin:bottom;animation:grow .7s var(--ease) both}
.chart2 small{font-size:10.5px;color:var(--faint)}
@keyframes grow{from{transform:scaleY(0)}}
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--mint-soft);color:var(--okt)}
.flag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.flag.off{background:var(--coral-soft);color:var(--badt)}
.flag.n{background:var(--sunk);color:var(--muted)}
.adm table{width:100%;border-collapse:collapse}
.adm th{text-align:left;font-size:12px;color:var(--faint);font-weight:550;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.adm tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--mint-soft);color:var(--okt)}.pill.r{background:var(--coral-soft);color:var(--badt)}.pill.y{background:var(--amber-soft);color:var(--warn)}.pill.v{background:var(--brand-soft);color:var(--brand-text)}
.neg{color:var(--badt);font-weight:600}.pos{color:var(--okt);font-weight:600}
.row-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.search{display:flex;gap:8px;margin-bottom:14px}
.adm input,.adm select,.adm textarea{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:500 14.5px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink)}
.adm textarea{height:auto;padding:10px 12px;resize:none;line-height:1.45}
.adm input:focus,.adm textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 15%,transparent)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:8px;font:550 13px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}.empty b{display:block;font-size:16px;color:var(--ink);font-weight:650;margin-bottom:4px}
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,20,.45);backdrop-filter:blur(3px);z-index:20;display:grid;place-items:center;padding:16px;animation:fade .2s}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto;animation:pop .25s var(--ease);box-shadow:var(--sh3)}
.sheet h3{font-size:19px;font-weight:650;margin:0 0 4px}.sheet label{display:block;font-weight:550;font-size:13px;margin:14px 0 6px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.err{background:var(--coral-soft);color:var(--badt);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:550;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#5b3df5;color:#fff;padding:10px 16px;border-radius:12px;font-weight:550;font-size:13.5px;z-index:30;animation:pop .25s;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.login{max-width:400px;margin:12vh auto;padding:0 16px}.login .acard{padding:26px}
.login form{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.mini div{background:var(--sunk);border-radius:12px;padding:10px 12px}.mini b{display:block;font-size:17px;font-weight:650}.mini small{color:var(--muted);font-size:12px}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.list-row:last-child{border:0}
.ademo{display:flex;justify-content:center;align-items:center;gap:8px;background:#5b3df5;color:#E8E6F5;font-size:12.5px;font-weight:500;padding:7px 12px}
.ademo::before{content:"";width:6px;height:6px;border-radius:50%;background:#12B886;box-shadow:0 0 0 3px rgba(18,184,134,.25)}
/* support inbox */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);height:min(720px,calc(100vh - 210px));min-height:460px;padding:0;overflow:hidden}
.tlist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tlist .th{padding:12px 12px 0}
.tlist .th .seg{margin-bottom:10px}
.tl-items{overflow-y:auto;flex:1}
.ti{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:flex-start;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.ti:hover{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.ti.on{background:var(--brand-soft)}
.ti .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:13px;background:color-mix(in srgb,var(--brand) 15%,var(--surface));color:var(--brand-text)}
.ti b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11.5px;color:var(--faint);white-space:nowrap}
.ti .ud{width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.ti.unread b{font-weight:700}.ti.unread small{color:var(--ink)}
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.conv-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.conv-h .who{flex:1;min-width:200px}
.conv-h .who b{display:block;font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-h .who small{color:var(--muted);font-size:12.5px}
.conv-h .back{display:none}
.cmsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--sunk) 35%,var(--surface))}
.bub{max-width:78%;padding:9px 13px;border-radius:15px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .25s var(--ease)}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:5px}
.bub.note{align-self:stretch;max-width:100%;background:#fdf6e3;border:1px dashed #e6c77a;color:#6b5414;font-size:13px;display:flex;gap:6px;align-items:flex-start}.bub.note svg{width:14px;height:14px;flex:none;margin-top:2px}
.aitag{font-style:normal;font-size:10px;font-weight:800;padding:1px 5px;border-radius:6px;background:#efebff;color:#5b3df5;vertical-align:1px}
.aibar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px}.aibar.on{background:#f3f0ff}.aibar>svg{width:18px;height:18px;flex:none;color:#5b3df5}.aibar>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.aibar small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.aitry{display:grid;gap:8px;margin:12px 0}
.aistats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}.aistats>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--sunk)}.aistats b{font-size:18px;font-weight:800}.aistats small{color:var(--muted);font-size:12px}
.fld.swrow,.sheet label.fld.swrow{display:flex!important;flex-direction:row!important;align-items:center;justify-content:space-between;gap:12px}.fld.swrow>span{flex:1;min-width:0}.fld.swrow small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}.fld.swrow .switch{flex:none}
@media (max-width:760px){.conv-h{flex-wrap:wrap!important}.conv-h .who{flex:1 1 140px}}.aichat{display:flex;flex-direction:column;gap:5px;margin-top:10px}.aichat small{color:var(--muted)}
#aisup .sec-h{align-items:flex-start}#aisup h2 svg{width:20px;height:20px;vertical-align:-3px}
.bt{font-size:11px;color:var(--faint);margin:2px 4px 8px}.bt.me{align-self:flex-end}
.reply{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line)}
.reply textarea{flex:1;min-height:42px;max-height:140px}
.adm .send{width:42px;height:42px;border-radius:12px;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.adm .send svg{width:18px;height:18px}
@media (max-width:760px){
  .top .bar{padding:10px 16px;gap:10px}
  .tabs{margin-left:0;width:100%}
  .amain{padding:20px 16px 80px}
  .kpis{grid-template-columns:1fr 1fr}
  .adm table.rs thead{display:none}
  .adm table.rs tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .adm table.rs td{border:0;padding:2px 0}
  .adm table.rs td.wide{grid-column:1/-1}
  .adm table.rs td[data-l]::before{content:attr(data-l) " ";color:var(--faint);font-size:12px;font-weight:600}
  .row-act{justify-content:flex-start}
  .mini{grid-template-columns:1fr 1fr}
  .inbox{grid-template-columns:1fr;height:calc(100vh - 190px)}
  .inbox.open .tlist{display:none}
  .inbox:not(.open) .conv{display:none}
  .tlist{border-right:0}
  .conv-h .back{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.adm *{animation:none!important;transition:none!important}}

/* ===== former look overrides ===== */
.adm{font-size:15px}
.adm h1{font-size:clamp(28px,3.4vw,36px);font-weight:800;letter-spacing:-.045em}
.adm .btn{--bh:40px;border-radius:99px;font:700 14px/1 var(--f);box-shadow:none;padding:0 16px}
.adm .btn.sm{--bh:34px;border-radius:99px;font-size:13px;padding:0 13px}
.adm .btn.primary{background:var(--brand);box-shadow:none}
.adm .btn.ok{background:#2e7d57}
.top{background:color-mix(in srgb,var(--bg) 86%,transparent);border-bottom-color:var(--line)}
.top .bar{max-width:1180px;padding:14px 24px}
.alogo{font-size:21px;letter-spacing:-.04em}
.alogo .mark{width:34px;height:34px;border-radius:10px;background:#5b3df5}
.alogo .mark svg{width:20px;height:20px}
.alogo small{border-radius:99px;padding:3px 9px;font-weight:800;background:var(--lilac);color:var(--lilac-ink)}
.tabs{padding:4px;border-radius:99px;background:var(--surface);gap:2px}
.tabs button{height:36px;padding:0 15px;border-radius:99px;font:700 14px var(--f)}
.tabs button.on{background:var(--ink-btn);color:var(--ink-btn-fg);box-shadow:none}
.tabs button.on .dot{box-shadow:0 0 0 2px var(--ink-btn)}
.amain{max-width:1180px;padding:28px 24px 80px}
.sub{font-size:15px}
.kpi{border:0;border-radius:22px;padding:18px 20px;background:var(--sunk)}
.kpis>.kpi:nth-child(4n+1){background:var(--lilac)}.kpis>.kpi:nth-child(4n+1) .v,.kpis>.kpi:nth-child(4n+1) .l{color:var(--lilac-ink)}

async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, credentials: 'same-origin', body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong'); e.status = r.status; throw e; }
  return j;
}
async function apiText(path) {
  if (DEMO) { const n = /emails\/(\w+)\/preview/.exec(path)[1]; const E = window.JP_EMAILS || {}; return path.includes('format=text') ? (E[n] || {}).text || '' : (E[n] || {}).html || '<p style="font-family:sans-serif;padding:20px">Preview available on the live server.</p>'; }
  const r = await fetch(path, { credentials: 'same-origin' }); if (!r.ok) throw new Error('Could not load the preview'); return r.text();
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
function sheet(html, onSubmit, onOpen) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg adm';
  bg.innerHTML = `<form class="sheet" role="dialog" aria-modal="true">${html}<div id="serr"></div></form>`;
  document.body.append(bg);
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
  bg.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = e.submitter; if (btn) btn.disabled = true;
    try { await onSubmit(new FormData(e.target), bg); close(); } catch (err) { $('#serr', bg).innerHTML = `<div class="err">${esc(err.message)}</div>`; if (btn) btn.disabled = false; }
  });
  if (onOpen) onOpen(bg, close);
  const f = bg.querySelector('input:not([type=file]):not([type=hidden]),textarea'); if (f && matchMedia('(min-width:761px)').matches) f.focus();
  return { bg, close };
}

const HUES = [['#efebff', '#5b3df5'], ['#e6f0ff', '#2f5fd0'], ['#fdf0dc', '#9a6512'], ['#e3f6ec', '#1f7a4f'], ['#fde8ec', '#c0334d'], ['#eae8f6', '#4c4a7a']];
const hue = (s) => HUES[[...String(s || '?')].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
/** Face for a person: their photo, or an illustrated initial on a brand-tinted circle (never a stock face). */
function avatar(p, size = 40, extra = '') {
  const name = (p && (p.name || p.email)) || '?';
  if (p && p.photo) return `<span class="av ${extra}" style="--s:${size}px"><img src="${esc(p.photo)}" alt="${esc(name)}" loading="lazy"></span>`;
  const [bg, fg] = hue(name);
  return `<span class="av ${extra}" style="--s:${size}px;background:${bg};color:${fg}" aria-hidden="true">${esc(name.trim().charAt(0).toUpperCase())}</span>`;
}

/* ---------- countries (shared list: /api/countries, countries.json in the demo) ---------- */
let CTRY = null, CMAP = new Map();
async function loadCountries() {
  if (CTRY) return CTRY;
  try { const r = await fetch(DEMO ? 'countries.json' : '/api/countries', { credentials: 'same-origin' }); CTRY = await r.json(); } catch { CTRY = []; }
  CMAP = new Map(CTRY.map((c) => [c.code, c])); return CTRY;
}
const cflag = (c) => (CMAP.get(c) || {}).flag || '🏳️';
const cname = (c) => (CMAP.get(c) || {}).name || c;
const murl = (u) => (DEMO && u ? u.replace(/^\//, '') : u);
const fold = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
/** "🌍 Global" / "🇳🇬 🇬🇭 +2 only" / "All except 🇷🇺" */
function ctrySummary(c) {
  c = c || { mode: 'global', list: [] };
  if (c.mode === 'global' || !c.list.length) return `<span class="ctry"><span class="fls">🌍</span>Global</span>`;
  const fl = c.list.slice(0, 3).map(cflag).join(''), more = c.list.length > 3 ? ` +${c.list.length - 3}` : '';
  const names = c.list.slice(0, 8).map(cname).join(', ') + (c.list.length > 8 ? '…' : '');
  return c.mode === 'only' ? `<span class="ctry" title="Only: ${esc(names)}"><span class="fls">${fl}</span>${more} only</span>` : `<span class="ctry ex" title="Not in: ${esc(names)}">All except <span class="fls">${fl}</span>${more}</span>`;
}
/** Searchable country multi-select with flags and chips. opts: {selected:[codes], single, onChange(codes), placeholder} */
function countryPicker(el, opts = {}) {
  let sel = [...(opts.selected || [])], q = '';
  el.innerHTML = `<div class="cpk"><div class="cps">${I(IC.search)}<input type="search" placeholder="${esc(opts.placeholder || 'Search countries')}" aria-label="Search countries" autocomplete="off"></div><div class="cpchips"></div><div class="cpl" role="listbox" ${opts.single ? '' : 'aria-multiselectable="true"'}></div>
    <div class="cpf"><span class="cnt"></span>${opts.single ? '' : '<button type="button" data-clr>Clear</button>'}</div></div>`;
  const inp = $('input', el), list = $('.cpl', el), chips = $('.cpchips', el);
  const draw = () => {
    const f = fold(q), items = (CTRY || []).filter((c) => !f || fold(c.name).includes(f) || c.code.toLowerCase() === f);
    const top = items.filter((c) => sel.includes(c.code)), rest = items.filter((c) => !sel.includes(c.code));
    list.innerHTML = [...top, ...rest].slice(0, 260).map((c) => `<button type="button" class="cpo ${sel.includes(c.code) ? 'on' : ''}" role="option" aria-selected="${sel.includes(c.code)}" data-cc="${c.code}"><span class="fl">${c.flag}</span><span class="nm">${esc(c.name)}</span><span class="cc">${c.code}</span>${opts.single ? '' : `<span class="tick">${sel.includes(c.code) ? '✓' : ''}</span>`}</button>`).join('') || '<div class="empty" style="padding:16px">No country matches.</div>';
    chips.innerHTML = opts.single ? '' : sel.map((c) => `<span class="cpchip">${cflag(c)} ${esc(cname(c))}<button type="button" data-rm="${c}" aria-label="Remove ${esc(cname(c))}">×</button></span>`).join('');
    $('.cnt', el).textContent = opts.single ? (sel[0] ? `${cflag(sel[0])} ${cname(sel[0])}` : 'Pick one') : sel.length ? `${sel.length} selected` : 'None selected';
  };
  const set = (v) => { sel = v; draw(); if (opts.onChange) opts.onChange(sel.slice()); };
  list.onclick = (e) => { const b = e.target.closest('[data-cc]'); if (!b) return; const c = b.dataset.cc; set(opts.single ? [c] : sel.includes(c) ? sel.filter((x) => x !== c) : [...sel, c]); };
  chips.onclick = (e) => { const b = e.target.closest('[data-rm]'); if (b) set(sel.filter((x) => x !== b.dataset.rm)); };
  const clr = $('[data-clr]', el); if (clr) clr.onclick = () => set([]);
  inp.oninput = () => { q = inp.value; draw(); };
  inp.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); const b = $('.cpo', list); if (b) b.click(); } };
  draw();
  return { get: () => sel.slice(), set };
}

const prettyVal = (v) => v == null ? '—' : typeof v === 'object' ? (Array.isArray(v) ? v.map(prettyVal).join(', ') : Object.entries(v).map(([k, x]) => `${k}: ${prettyVal(x)}`).join(' · ')) : String(v);
function auditSummary(s) {
  if (!s || typeof s !== 'object') return s ? `<span>${esc(String(s))}</span>` : '';

}

/** Fit an image inside a 320px square (no cropping) — for logos. */
function fitImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 320; const k = Math.min(280 / img.width, 280 / img.height);
    const w = img.width * k, h = img.height * k; c.getContext('2d').drawImage(img, (320 - w) / 2, (320 - h) / 2, w, h); URL.revokeObjectURL(img.src); res(c.toDataURL('image/png')); };
    img.onerror = () => rej(new Error('That file isn’t an image we can read.')); img.src = URL.createObjectURL(file); });
}

/** Shrink an image to a 320px square (center crop) in the browser before uploading. */
function squareImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 320;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 320, 320); x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 320, 320); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.88)); };
    img.onerror = () => rej(new Error('That file isn’t an image we can read.')); img.src = URL.createObjectURL(file); });
}

  el.innerHTML = `<div class="sec-h"><div><h2>Joe earnings</h2><p>${esc(r.from)} → ${esc(r.to)}. AI cost is what your provider charges for the tokens; revenue is the credits customers paid for Joe answers.</p></div>
      <span class="seg" style="margin:0">${[7, 30, 90].map((d) => `<button type="button" data-jd="${d}" class="${Math.round((Date.parse(r.to) - Date.parse(r.from)) / 864e5) + 1 === d ? 'on' : ''}">${d}d</button>`).join('')}</span></div>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="kpi"><span class="v">${num(T.messages)}</span><span class="l">AI answers · ${num(T.paid_messages)} paid · ${num(T.free_messages)} free</span></div>
      <div class="kpi"><span class="v">${usd(T.revenue_usd)}</span><span class="l">Revenue (${num(T.credits)} credits)</span></div><div class="kpi"><span class="v">${usd(T.ai_cost_usd)}</span><span class="l">AI cost (incl. free and failed)</span></div>
      <div class="kpi ${T.margin_usd >= 0 ? 'good' : 'hot'}"><span class="v">${usd(T.margin_usd)}</span><span class="l">Margin${T.margin_pct != null ? ' · ' + T.margin_pct + '%' : ''}</span></div></div>
    ${r.by_day.length ? `<div class="chart2" style="height:110px">${r.by_day.slice(-30).map((d) => `<div title="${d.day}: ${usd(d.revenue_usd)} revenue, ${usd(d.ai_cost_usd)} cost"><i style="height:${Math.max(2, d.revenue_usd / mx * 100)}%"></i><small>${d.day.slice(8)}</small></div>`).join('')}</div>` : '<div class="empty" style="padding:14px">No AI answers in this period.</div>'}

function pbSheet(p, text, useWhen, editable, canEdit) {
  const custom = p && p.source === 'custom', builtin = p && !custom;
  const { bg } = sheet(`<h3>${p ? esc(p.name) : 'New playbook'}</h3><p class="sub" style="margin:4px 0 0">${builtin ? 'Built-in playbook (read-only). “Customise” makes your own copy with the same name; Joe then uses yours.' : 'Markdown is fine. Joe reads up to 40,000 characters of it.'}</p>
    <div class="fgrid"><label class="fld"><span>Name</span><input name="name" maxlength="60" value="${esc(p ? p.name : '')}" ${p ? 'readonly' : ''} placeholder="e.g. nutra-latam" required></label><label class="fld"><span>Use when</span><input name="use_when" maxlength="300" value="${esc(useWhen || '')}" ${editable ? '' : 'readonly'} placeholder="e.g. nutra offers in Latin America"></label></div>
    <label class="fld"><span>Playbook <small style="color:var(--faint);font-weight:600"><span id="pbn">${num((text || '').length)}</span> / 60,000</small></span><textarea name="body" class="pbtext" maxlength="60000" ${editable ? '' : 'readonly'}>${esc(text || '')}</textarea></label>
    <div class="stick">${custom && editable ? `<button type="button" class="btn no" id="pbdel">${I(IC.trash)}<span>${p.overrides ? 'Delete (use built-in)' : 'Delete'}</span></button>` : ''}<span style="flex:1"></span><button type="button" class="btn" data-close>${editable ? 'Cancel' : 'Close'}</button>${builtin && canEdit ? '<button type="button" class="btn" id="pbcust">Customise</button>' : ''}${editable ? `<button class="btn primary">${p ? 'Save' : 'Add playbook'}</button>` : ''}</div>`,
  async (f) => { const body = { name: f.get('name'), use_when: f.get('use_when'), body: f.get('body') };
    if (p) await api('PUT', '/api/admin/joe/playbooks/' + encodeURIComponent(p.name), body); else await api('POST', '/api/admin/joe/playbooks', body);
    toast(p ? 'Playbook saved' : 'Playbook added'); drawPlaybooks(); });
  $('.sheet', bg).classList.add('wide');
  const ta = $('[name=body]', bg); ta.oninput = () => { $('#pbn', bg).textContent = num(ta.value.length); };
  const d = $('#pbdel', bg); if (d) d.onclick = async () => { if (!confirm(`Delete “${p.name}”?${p.overrides ? ' Joe goes back to the built-in version.' : ''}`)) return; try { await api('DELETE', '/api/admin/joe/playbooks/' + encodeURIComponent(p.name)); bg.remove(); toast('Deleted'); drawPlaybooks(); } catch (e) { toast(e.message); } };
  const c = $('#pbcust', bg); if (c) c.onclick = () => { bg.remove(); pbSheet(null, text, useWhen, true); setTimeout(() => { const n = $$('.sheet [name=name]').pop(); if (n) n.value = p.name; }, 0); };
}
