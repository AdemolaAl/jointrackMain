const LANGS=[['en','🇬🇧','English'],['ru','🇷🇺','Русский'],['fr','🇫🇷','Français'],['pt','🇵🇹','Português'],['es','🇪🇸','Español']];
const I18N={lang:'en', dict:{}, rev:null, en:null};
function tt(k, en, vars){ let s=(I18N.lang!=='en'&&I18N.dict[k]!=null)?I18N.dict[k]:en; if(s==null) s=k; if(vars) s=String(s).replace(/\{(\w+)\}/g,(m,x)=>vars[x]!=null?vars[x]:m); return s; }
const pickLang = () => { const q=new URLSearchParams(location.search).get('lang'); let saved=null; try{ saved=localStorage.getItem('jv_lang'); }catch{}
  const nav=(navigator.language||'en').slice(0,2).toLowerCase(), ok=l=>LANGS.some(x=>x[0]===l); return ok(q)?q:ok(saved)?saved:ok(nav)?nav:'en'; };

  I18N.lang=LANGS.some(x=>x[0]===l)?l:'en'; document.documentElement.lang=I18N.lang;
  if (I18N.lang==='en'){ I18N.dict={}; return; }
  try { const [d,e]=await Promise.all([fetch(`i18n/app.${I18N.lang}.json`).then(r=>r.ok?r.json():{}), I18N.en?Promise.resolve(I18N.en):fetch('i18n/app.en.json').then(r=>r.ok?r.json():{})]);
    I18N.dict=d||{}; I18N.en=e||{}; I18N.rev=new Map(); for (const [k,v] of Object.entries(I18N.en)) if (!I18N.rev.has(v)||k.startsWith('auto.')) I18N.rev.set(v,k); }
  catch { I18N.dict={}; }
}
function trNode(root){
  if (I18N.lang==='en' || !I18N.rev || !root) return;
  /* exact match first; then numbers become {0},{1}… so "12 of 20 deposits" finds "{0} of {1} deposits" */
  const tr=s=>{ const v=s.trim(); let k=I18N.rev.get(v); if (k&&I18N.dict[k]) return s.replace(v,I18N.dict[k]);
    if (!/\d/.test(v)) return null; const nums=[]; const p=v.replace(/[$€£₦]?\d(?:[\d,.:]*\d)?(?:%|×|[kKmMh]\b)?/g,m=>'{'+(nums.push(m)-1)+'}');
    k=I18N.rev.get(p); if (!k||!I18N.dict[k]) return null; return s.replace(v,I18N.dict[k].replace(/\{(\d+)\}/g,(m,i)=>nums[i]!=null?nums[i]:m)); };
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentNode&&/^(SCRIPT|STYLE|CODE|TEXTAREA|PRE)$/i.test(n.parentNode.nodeName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){ const v=n.nodeValue; if (!v||v.trim().length<2) continue; const x=tr(v); if (x!=null) n.nodeValue=x; }

}

  for (const m of ms) for (const n of m.addedNodes){ if (n.nodeType===1) trQ.add(n); else if (n.nodeType===3&&n.parentNode) trQ.add(n.parentNode); } });

async function api(method, path, body){
  if (DEMO) return Demo.handle(method, path, body);
  const r = await fetch(path, {method, credentials:'same-origin', headers: body?{'content-type':'application/json'}:{}, body: body?JSON.stringify(body):undefined});
  const j = await r.json().catch(()=>({}));
  if (r.status===401 && !/\/api\/(login|signup|reset|forgot|password|support)/.test(path)) { stopTimers(); renderAuth('login'); throw new Error('Please log in'); }
  if (!r.ok || j.error){ const e=new Error(j.error || 'Something went wrong. Try again.'); e.data=j; e.body=j; e.status=r.status; throw e; }
  return j;
}

/* ---------- dates & ranges ---------- */
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const parseYmd = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const PRESETS = [['today','Today'],['7d','Last 7 days'],['30d','Last 30 days'],['90d','Last 3 months'],['180d','Last 6 months'],['365d','Last 12 months'],['custom','Custom range']];
const S = { page:'overview', preset: store.get('preset','30d'), from:store.get('from',null), to:store.get('to',null), channel:'', type:'', q:'', rows:[], total:0, feed:[], chans:null, me:{}, bill:null, timers:[], dim:'campaign', bsort:{k:'joins',d:-1}, cmpN:store.get('cmpN',6), cmpM:store.get('cmpM','joins'), cmpYoY:false, collapsed:store.get('col',false) };
function range(){
  const t=new Date();
  if (S.preset==='today') return [ymd(t),ymd(t)];
  if (S.preset==='custom'){ let f=S.from||ymd(addDays(t,-13)), to=S.to||ymd(t); if(f>to)[f,to]=[to,f]; return [f,to]; }
  return [ymd(addDays(t,-(parseInt(S.preset,10)-1))), ymd(t)];
}
const tzq = () => `tz=${new Date().getTimezoneOffset()}`;
const chq = () => S.channel ? '&channel='+S.channel : '';
const rq = () => { const [f,t]=range(); return `from=${f}&to=${t}&${tzq()}${chq()}`; };
function prevRange(){ const [f0,t0]=range(), span=Math.round((parseYmd(t0)-parseYmd(f0))/864e5)+1; return [ymd(addDays(parseYmd(f0),-span)), ymd(addDays(parseYmd(f0),-1)), span]; }
function rangeLabel(){
  if (S.preset!=='custom') return PRESETS.find(p=>p[0]===S.preset)[1];
  const [f,t]=range(), o={month:'short',day:'numeric'}; return parseYmd(f).toLocaleDateString('en-US',o)+' – '+parseYmd(t).toLocaleDateString('en-US',o);
}

const pwField = (id,label,ac,extra='') => `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="inp" id="${id}" type="password" minlength="8" autocomplete="${ac}" required ${extra}><button type="button" data-act="pw-eye" aria-label="Show password">${I.eye}</button></div></div>`;
function renderForgot(){
  authShell(`<h1>Reset your password</h1><p>Enter your email. We’ll send you a link to choose a new one.</p>
    <form id="ff"><div class="field"><label for="fe">Email</label><input class="inp" id="fe" type="email" autocomplete="email" required></div><div id="ferr"></div><button class="btn primary lg wide" type="submit">Send reset link</button></form>
    <p class="auth-foot"><a href="#" data-act="auth" data-m="login">Back to log in</a></p>`);
  $('#ff').addEventListener('submit', async e=>{ e.preventDefault(); const b=e.submitter; b.disabled=true;
    try { const r=await api('POST','/api/forgot',{email:$('#fe').value}); $('#ff').outerHTML=`<div class="okbar">${I.checkc}<span>${esc(r.message||'Check your inbox for the link.')}</span></div>`; }
    catch(err){ $('#ferr').innerHTML=`<div class="err">${esc(err.message)}</div>`; b.disabled=false; } });
}
function renderReset(token){
  authShell(`<h1>Choose a new password</h1><p>Use at least 8 characters.</p>
    <form id="rf">${pwField('rp','New password','new-password')}<div id="rerr"></div><button class="btn primary lg wide" type="submit">Save and log in</button></form>`);
  $('#rf').addEventListener('submit', async e=>{ e.preventDefault();
    try { await api('POST','/api/reset',{token,password:$('#rp').value}); history.replaceState(null,'',location.pathname); toast('Password changed'); boot(); }
    catch(err){ $('#rerr').innerHTML=`<div class="err">${esc(err.message)} <a href="#" data-act="forgot" style="color:inherit"><b>Send a new link</b></a></div>`; } });
}
async function renderAuth(mode){
  let cfg={signup:true}; if(!DEMO) try{ cfg = await (await fetch('/api/config')).json(); }catch{}
  authShell(`<h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p>${mode==='login'?'Log in to see who joined, and who deposited.':'Free to set up. About 10 minutes, no code.'}</p>
    <div class="trust"><span>${I.check}First ${fmt(PRICE().free_joins)} joins free</span><span>${I.check}10-minute setup</span><span>${I.check}No code</span></div>
    <form id="af"><div class="field"><label for="ae">Email</label><input class="inp" id="ae" type="email" autocomplete="email" required placeholder="you@company.com"></div>
    ${pwField('ap','Password',mode==='login'?'current-password':'new-password')}
    ${mode==='login'?'<div style="display:flex;justify-content:flex-end;margin-top:-6px"><a href="#" class="link" data-act="forgot">Forgot password?</a></div>':''}
    <div id="aerr"></div><button class="btn primary lg wide" type="submit">${mode==='login'?'Log in':'Create account'} ${I.arrow}</button></form>
    ${cfg.signup?`<p class="auth-foot">${mode==='login'?`New to Joinvoo? <a href="${SIGNUP}">Create an account</a>`:'Have an account? <a href="#" data-act="auth" data-m="login">Log in</a>'}</p>`:''}
    <p class="auth-foot" style="margin-top:8px"><a href="${HOME_LINK}terms" style="color:var(--faint);font-weight:500">Terms</a> · <a href="${HOME_LINK}privacy" style="color:var(--faint);font-weight:500">Privacy</a> · By Zedapex company</p>`);
  $('#af').addEventListener('submit', async e => { e.preventDefault(); const b=e.submitter; b.disabled=true;
    try { await api('POST', mode==='login'?'/api/login':'/api/signup', {email:$('#ae').value,password:$('#ap').value}); boot(); }
    catch(err){ $('#aerr').innerHTML=`<div class="err">${esc(err.message)}</div>`; b.disabled=false; } });
}
