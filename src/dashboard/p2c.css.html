<style>
/* ================= Round 6: Joomoji, Joe, Pro, language ================= */
.jface,.joe-f{display:inline-grid;place-items:center;flex:none;border-radius:50%;line-height:0}
.jface svg{width:100%;height:100%;border-radius:50%;display:block}
.joe-f svg{width:100%;height:100%;display:block;overflow:visible}
.joe-fb{background:var(--lilac);border-radius:50%}
.me-row .jface{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--brand-soft)}
.tb-ava .jface{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--brand-soft);transition:transform .2s var(--ease)}
.tb-ava:hover .jface{transform:scale(1.06) rotate(-4deg)}
.nav-joe,.bb-joe{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.bb-joe{width:26px;height:26px;margin:-3px 0 -2px}
.nav-a[aria-current="page"] .nav-joe svg{filter:drop-shadow(0 0 6px rgba(200,241,105,.6))}
.greet{display:flex!important;align-items:center;gap:10px}
.greet .jface{box-shadow:0 6px 16px -8px rgba(43,26,143,.5)}
.langb{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 10px 0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);white-space:nowrap}
.langb svg{width:14px;height:14px;color:var(--faint)}
.flag{font-size:16px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pop .pi .flag{width:17px;text-align:center}
.pu-me{display:flex!important;flex-direction:row!important;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;text-align:left;border-radius:16px;font:inherit;color:inherit}
.pu-me:hover{background:var(--sunk)}
.pu-me>span:last-child{display:flex;flex-direction:column;min-width:0}
.probadge{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:99px;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:linear-gradient(135deg,#5b3df5,#8d78ff);color:#fff;vertical-align:2px}
.probadge.sm{height:20px;font-size:10.5px;letter-spacing:.02em;background:var(--lime);color:var(--lime-ink)}
.side-card .probadge{margin-left:4px}

/* My Joomoji */
.jm-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:32px;min-height:330px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;padding:24px;
  background:radial-gradient(70% 90% at 25% 30%,#fff 0%,transparent 60%),linear-gradient(135deg,#efebff,#e3f6d0 55%,#fde8f0)}
.jm-hero [data-depth]{transition:transform .35s var(--ease)}
.jm-main{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:2}
.jm-big{width:190px;height:190px;border-radius:50%;box-shadow:0 30px 60px -24px rgba(43,26,143,.5),0 0 0 8px rgba(255,255,255,.7);animation:jmIn .7s var(--ease) both}
@keyframes jmIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}}
.jm-tag{display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:var(--sh2)}
.jm-tag b{font-size:18px;font-weight:800;letter-spacing:-.02em;color:#141413}.jm-tag small{font-size:12px;color:#67665f;font-weight:600}
.jm-lounge{position:relative;z-index:1;display:grid;place-items:end center;height:100%}
.lounge{width:min(100%,380px);height:auto;filter:drop-shadow(0 20px 30px rgba(43,26,143,.18))}
.lounge .lap-g{transform-box:fill-box;transform-origin:center;animation:lapB 3.4s ease-in-out infinite}
@keyframes lapB{50%{transform:translateY(-2px) rotate(-1deg)}}
.jm-float{position:absolute;inset:0;z-index:3;pointer-events:none}
.jm-note{position:absolute;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 12px 8px 8px;border-radius:16px;background:#fff;box-shadow:0 14px 30px -14px rgba(43,26,143,.45);font-size:12.5px;color:#141413;animation:noteF 6s ease-in-out infinite}
.jm-note svg{grid-row:1/3;width:28px;height:28px;padding:6px;border-radius:10px;background:#efebff;color:#5b3df5}
.jm-note b{font-weight:800}.jm-note small{color:#2e7d57;font-weight:700;font-size:11.5px}
.jm-note.n1{left:4%;top:9%}.jm-note.n2{right:5%;top:12%;animation-delay:-3s}.jm-note.n2 svg{background:#e8f3ec;color:#2e7d57}
@keyframes noteF{50%{transform:translateY(-8px)}}
.jm-coin,.jh-coin{position:absolute;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#6b4a00;background:radial-gradient(circle at 35% 30%,#fff3b8,#f2c14e 45%,#d99a12);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 8px 16px -6px rgba(0,0,0,.35);animation:coinB 4s ease-in-out infinite}
.jm-coin.c1{left:44%;top:8%}.jm-coin.c2{right:12%;bottom:24%;animation-delay:-1.3s;transform:scale(.8)}.jm-coin.c3{left:10%;bottom:16%;animation-delay:-2.6s}
@keyframes coinB{50%{transform:translateY(-12px) rotate(18deg)}}
.jm-spark{position:absolute;width:14px;height:14px;background:#c8f169;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spk 2.4s ease-in-out infinite}
.jm-spark.s1{left:32%;top:20%}.jm-spark.s2{right:30%;bottom:12%;animation-delay:-1.2s;background:#8d78ff}
@keyframes spk{50%{transform:scale(1.5) rotate(45deg);opacity:.5}}
.jm-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.jm-ed .utabs{padding:14px 18px 4px}
.jm-body{padding:12px 18px 20px;display:flex;flex-direction:column;gap:16px}
.jm-row{display:flex;flex-direction:column;gap:10px}
.jm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px}
.jm-opt{border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:4px;cursor:pointer;display:grid;place-items:center;aspect-ratio:1;transition:transform .15s var(--ease),border-color .15s}
.jm-opt svg{width:100%;height:auto;max-width:64px;border-radius:50%}
.jm-opt:hover{transform:translateY(-2px)}
.jm-opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
.jm-sw{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:transform .15s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--brand)}
.jm-prof{padding:20px}

/* Joe pop-up */
.joepop{position:fixed;left:24px;bottom:24px;z-index:58;width:min(380px,calc(100vw - 32px));display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 12px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(43,26,143,.45);animation:jpIn .5s var(--ease) both}
.shell:not(.col)~.joepop{left:268px}
.joepop.out{animation:jpOut .3s var(--ease) both}
@keyframes jpIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
@keyframes jpOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
.joepop::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.joepop.lv-good::before{background:var(--mint)}.joepop.lv-warn::before{background:var(--amber)}.joepop.lv-bad::before{background:var(--coral)}
.jp-face{flex:none;margin-top:-6px}
.jp-b{flex:1;min-width:0}
.jp-who{display:block;font-size:11.5px;font-weight:800;color:var(--brand-text);letter-spacing:.02em}
.jp-b b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.jp-b p{font-size:13.5px;color:var(--muted);margin-top:3px}
.jp-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.joepop .x{width:30px;height:30px;box-shadow:none;background:var(--sunk);flex:none}
.joepop .x svg{width:14px;height:14px}

/* Joe page */
.joe-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:32px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:10px;padding:28px;color:#fff;min-height:320px;transition:background .6s}
.joe-hero.mood-good{background:radial-gradient(80% 110% at 85% 20%,#8d78ff 0%,#5b3df5 45%,#2b1a8f 100%)}
.joe-hero.mood-calm{background:radial-gradient(80% 110% at 85% 20%,#7fb3ff 0%,#4b63e0 45%,#22307e 100%)}
.joe-hero.mood-warn{background:radial-gradient(80% 110% at 85% 20%,#ffb86b 0%,#d9772b 45%,#6b3410 100%)}
.joe-hero.mood-bad{background:radial-gradient(80% 110% at 85% 20%,#ff8a8a 0%,#d2464a 45%,#5c1418 100%)}
.joe-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 45%,transparent 60%);background-size:250% 100%;animation:shine 6s ease-in-out infinite;z-index:-1;pointer-events:none}
.jh-copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.jh-eb{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;opacity:.92;letter-spacing:.01em}
.jh-copy h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1.05}
.jh-copy p{font-size:15.5px;opacity:.9;max-width:44ch}
.jh-quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.jq{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:8px 14px;font:700 13px var(--f);cursor:pointer;transition:background .15s,transform .15s}
.jq:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.jh-stage{position:relative;height:280px}
.jh-stage [data-depth]{transition:transform .35s var(--ease)}
.jh-joe{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);z-index:3;filter:drop-shadow(0 24px 30px rgba(0,0,0,.35))}
.jh-l{position:absolute;inset:0}
.jh-bars{position:absolute;left:4%;bottom:12%;display:flex;align-items:flex-end;gap:5px;height:80px;padding:10px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);animation:noteF 5s ease-in-out infinite}
.jh-bars i{width:9px;height:var(--h);border-radius:4px;background:linear-gradient(180deg,#e7ffb0,#c8f169);transform-origin:bottom;animation:barUp 2.8s ease-in-out infinite}
.jh-bars i:nth-child(2){animation-delay:-.6s}.jh-bars i:nth-child(3){animation-delay:-1.2s}.jh-bars i:nth-child(4){animation-delay:-1.8s}.jh-bars i:nth-child(5){animation-delay:-2.4s}
@keyframes barUp{50%{transform:scaleY(.7)}}
.jh-bub{position:absolute;width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:#fff;color:#5b3df5;font-weight:800;font-size:20px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);animation:noteF 4.4s ease-in-out infinite}
.jh-bub svg{width:22px;height:22px}
.jh-bub.b1{right:6%;top:10%}.jh-bub.b2{right:16%;bottom:6%;animation-delay:-2s;color:#7fa82c}
.mood-warn .jh-bub.b1{color:#d9772b}.mood-bad .jh-bub.b1{color:#d2464a}
.jh-coin.k1{left:16%;top:14%}.jh-coin.k2{right:4%;bottom:34%;animation-delay:-2s}
.jh-orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%)}
.jh-orb.o1{width:160px;height:160px;left:20%;top:-20%}.jh-orb.o2{width:120px;height:120px;right:-6%;bottom:-16%}
.joe-ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.jcard{padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--brand);animation:rise .5s var(--ease) both}
.jcard.lv-good{border-left-color:var(--mint)}.jcard.lv-warn{border-left-color:var(--amber)}.jcard.lv-bad{border-left-color:var(--coral)}.jcard.lv-info{border-left-color:var(--brand)}
.jc-i{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--lilac);color:var(--lilac-ink)}
.jc-i svg{width:17px;height:17px}
.lv-good .jc-i{background:var(--mint-soft);color:var(--mint-ink)}.lv-warn .jc-i{background:var(--cream);color:var(--cream-ink)}.lv-bad .jc-i{background:var(--blush);color:var(--blush-ink)}
.jcard b{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.jcard p{font-size:13.5px;color:var(--muted)}
.jc-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--faint);font-weight:600}
.jc-m strong{color:var(--ink);font-size:16px;font-weight:800}
.jcard .btn{align-self:flex-start;margin-top:4px}
.joe-chat{display:flex;flex-direction:column;overflow:hidden}
.jc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.jc-head>div:first-child{display:flex;align-items:center;gap:10px}
.jc-head b{display:block;font-weight:800;font-size:16px}.jc-head small{display:block;font-size:12.5px;color:var(--faint)}
.jc-tools{display:flex;align-items:center;gap:6px}
.jc-msgs{display:flex;flex-direction:column;gap:12px;padding:18px;min-height:260px;max-height:520px;overflow-y:auto;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--lilac) 35%,var(--surface)))}
.jc-empty{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px;max-width:340px}
.jc-empty b{font-size:17px;font-weight:800}.jc-empty span{color:var(--muted);font-size:14px}
.jmr{display:flex;align-items:flex-end;gap:8px;animation:msgin .3s var(--ease)}
.jmr.me{justify-content:flex-end}
.jbub{max-width:min(78%,560px);padding:11px 14px;border-radius:20px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.jbub.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--sh1)}
.jbub.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.jbub b{font-weight:800}
.mdn,.mdb{color:var(--brand-text);font-weight:800}
.jc-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:12px 18px 0}
.jc-sugg .jq,.cmp-ins .jq{border-color:var(--line);background:var(--surface);color:var(--brand-text);backdrop-filter:none}
.jc-sugg .jq:hover{background:var(--lilac)}
.jc-comp{display:flex;gap:8px;padding:12px 18px 16px}
.jc-comp .inp{border-radius:99px;padding:0 18px}
.jc-comp .send{width:46px;height:46px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.jc-comp .send svg{width:18px;height:18px}.jc-comp .send:disabled{opacity:.5}
.joe-page{gap:16px}

/* Pro, trial, locks */
.trialc{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--lilac);flex-wrap:wrap}
.trialc.ended{background:var(--cream)}
.tc-ic{width:40px;height:40px;border-radius:14px;background:var(--surface);color:var(--brand-text);display:grid;place-items:center;flex:none}
.tc-ic svg{width:19px;height:19px}
.trialc>div{flex:1;min-width:200px}
.trialc b{display:block;font-weight:800;font-size:15px}.trialc span{display:block;font-size:13.5px;color:var(--muted)}
.tc-bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tc-bars small{font-size:12px;font-weight:700;color:var(--lilac-ink)}
.tc-bars i{display:block;height:7px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent);overflow:hidden;margin-top:4px}
.tc-bars em{display:block;height:100%;border-radius:99px;background:var(--brand)}
.plan2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 20px}
.pc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:22px;border:2px solid var(--line);background:var(--surface)}
.pc.pro{background:linear-gradient(160deg,var(--lilac),var(--surface) 70%);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.pc.cur{border-color:var(--brand)}
.pc em{position:absolute;top:-10px;right:14px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;background:linear-gradient(135deg,#5b3df5,#8d78ff);color:#fff;padding:3px 10px;border-radius:99px}
.pc-n{font-weight:800;font-size:14px;color:var(--muted)}
.pc-p{font-size:26px;font-weight:800;letter-spacing:-.04em;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pc-p small{font-size:12.5px;color:var(--faint);font-weight:600;letter-spacing:0}
.pc-u{font-size:12.5px;color:var(--faint);margin-bottom:8px}
.pcmp{list-style:none;margin:0 20px 12px;padding:0;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pcmp li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.8fr);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.pcmp li:first-child{border-top:0}
.pcmp li.h{background:var(--sunk);font-size:12.5px}
.pcmp li>b{text-align:center;font-weight:700}
.pcmp .yes{color:var(--mint-ink)}.pcmp .yes svg{width:17px;height:17px}.pcmp .no{color:var(--faint)}
.pcmp small{font-size:12px;color:var(--brand-text);font-weight:700}
.pro-hero{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--lilac)}
.pro-hero b{display:block;font-weight:800}.pro-hero span{display:block;font-size:13.5px;color:var(--muted)}
.lockb{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:linear-gradient(120deg,var(--lilac),var(--cream));flex-wrap:wrap;margin:0 0 4px}
.lockb .lb-i{width:38px;height:38px;border-radius:12px;background:var(--surface);color:var(--brand-text);display:grid;place-items:center;flex:none}
.lockb .lb-i svg{width:18px;height:18px}
.lockb>div{flex:1;min-width:200px}.lockb b{display:block;font-weight:800;font-size:14.5px}.lockb span{display:block;font-size:13px;color:var(--muted)}
#btbl .lockb{margin:6px 18px 12px}
.lockc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--lilac);color:var(--lilac-ink)}
.lockc svg{width:13px;height:13px}
.kpi.locked .kn svg{width:28px;height:28px;opacity:.7}
.lockwrap{position:relative;min-height:280px;overflow:hidden}
.lk-blur{filter:blur(5px);opacity:.6;padding:12px 18px;pointer-events:none}
.lk-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.lk-l{height:12px;border-radius:99px;background:var(--line-2)}
.lk-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 40%,transparent),color-mix(in srgb,var(--surface) 85%,transparent))}
.lk-over b{font-size:17px;font-weight:800;max-width:38ch}.lk-over span{font-size:13.5px;color:var(--muted);max-width:46ch}
/* smart links */
.bk-sec summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.bk-sec summary::-webkit-details-marker{display:none}
.bk-sec summary>svg{width:16px;height:16px;color:var(--faint);transition:transform .2s}
.bk-sec[open] summary>svg{transform:rotate(180deg)}
.bk-t b{display:block;font-weight:800;font-size:14px}.bk-t small{display:block;font-size:12px;color:var(--faint)}
.bk-body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bk-body .sel{height:38px;font-size:13.5px}
.bk-on{background:var(--cream)}
.bk-ban{display:flex;gap:10px;align-items:flex-start}
.bk-ban>span{width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;color:var(--cream-ink);flex:none}
.bk-ban>span svg{width:16px;height:16px}
.bk-ban b{display:block;font-weight:800;font-size:14px;color:var(--ink)}.bk-ban small{display:block;font-size:12.5px;color:var(--cream-ink)}
.langk{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 5px;border-radius:6px;background:var(--sunk);font-size:10.5px;font-weight:800;margin-right:8px;color:var(--muted)}
/* compare upgrades */
.cpre{margin-top:-6px}

.scc{flex:0 0 calc((100% - 16px)/2);scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;min-height:408px;border-radius:30px;overflow:hidden;isolation:isolate;color:#fff;background:linear-gradient(155deg,var(--c1) 0%,var(--c2) 100%);box-shadow:0 1px 2px rgba(0,0,0,.06),0 22px 40px -26px color-mix(in srgb,var(--c2) 90%,#000);transition:transform .45s var(--ease),box-shadow .45s var(--ease);-webkit-user-select:none;user-select:none}
