<style>
/* ================= Phase A components ================= */
:root{--peach:#fdeee4;--peach-ink:#b4541f;--teal:#e2f5f3;--teal-ink:#1d7a74}
@media (prefers-color-scheme: dark){:root[data-jv="system"]{--peach:#2e1d12;--peach-ink:#f2a77a;--teal:#10282a;--teal-ink:#6fd3cb}}
:root[data-jv="dark"]{--peach:#2e1d12;--peach-ink:#f2a77a;--teal:#10282a;--teal-ink:#6fd3cb}
.kpi.t-peach{--tone:var(--peach);--tone-ink:var(--peach-ink)}.kpi.t-teal{--tone:var(--teal);--tone-ink:var(--teal-ink)}
.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.k8 .spark{display:none}
.t.sp .hm{display:none}
.t.sp td.k{max-width:220px}
.nav-a .nsub{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:-1px;letter-spacing:0}
.nav-a:has(.nsub){height:50px}
.chip.sus{margin-left:8px;height:21px;font-size:11px;vertical-align:1px}
.fakec svg{width:14px;height:14px}
.roas.g{color:var(--mint-ink)}.roas.r{color:var(--coral-ink)}
.spend-cta{display:flex;align-items:center;gap:14px;margin:6px 18px 12px;padding:14px 16px;border-radius:18px;background:var(--cream);color:var(--cream-ink);flex-wrap:wrap}
.spend-cta>span{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.spend-cta>span svg{width:20px;height:20px}
.spend-cta div{flex:1;min-width:200px}.spend-cta b{display:block;color:var(--ink);font-weight:800}.spend-cta small{font-size:13px;opacity:.9}

/* conversions tabs + integrations */
.cvtabs{padding:0;margin-bottom:-4px}
.cvtabs button{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 18px;font-size:14px}
.cvtabs button svg{width:16px;height:16px}
.evc{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.evc.ev-ftd{background:var(--mint-soft);color:var(--mint-ink)}.evc.ev-dep{background:var(--teal);color:var(--teal-ink)}.evc.ev-reg{background:var(--lilac);color:var(--lilac-ink)}
.evc.ev-sale{background:var(--sky);color:var(--sky-ink)}.evc.ev-qualified{background:var(--lime);color:var(--lime-ink)}.evc.ev-lead{background:var(--cream);color:var(--cream-ink)}
.evc.ev-rejected,.evc.rej{background:var(--blush);color:var(--blush-ink)}
.int-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.int-head h2{font-size:22px;font-weight:800;letter-spacing:-.03em}.int-head p{font-size:14.5px;max-width:60ch;margin-top:4px}
.int-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.icard{padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .2s var(--ease),box-shadow .2s}
.icard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.icard.on{border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.ic-top{display:flex;align-items:center;gap:12px}.ic-top{flex-wrap:wrap}.ic-top .ic-n{min-width:110px;flex:1}.ic-top>.chip{order:3;margin-left:0}
.ic-n{flex:1;min-width:0}.ic-n b{display:block;font-weight:800;font-size:15.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ic-n small{color:var(--faint);font-size:12.5px;font-weight:600}
.ilogo{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;overflow:hidden;background:color-mix(in srgb,var(--ic) 14%,var(--surface));color:var(--ic);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ic) 22%,transparent)}
.ilogo b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.ilogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ilogo:has(img){width:92px;border-radius:12px;box-shadow:0 6px 16px -10px rgba(20,20,40,.45)}.ilogo.lg:has(img){width:104px;height:52px}
.ilogo.lg{width:52px;height:52px;border-radius:16px}
.ic-chips{display:flex;gap:6px;flex-wrap:wrap}
.ic-ev{display:flex;gap:5px;flex-wrap:wrap}
.evp{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.ic-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.ic-foot small{font-size:12.5px;min-width:0}

/* join-request mode */
.jr-sec{background:color-mix(in srgb,var(--lilac) 45%,var(--surface))}
.jr-sec.on{background:var(--lilac)}
.jr-t{flex:1;min-width:0}.jr-t b{display:block;font-weight:800;font-size:14px}.jr-t small{color:var(--lilac-ink);font-weight:700;font-size:12px}
.jr-sum{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tgp-mini{font-size:13px;color:var(--ink);background:var(--surface);border-radius:14px 14px 14px 4px;padding:8px 12px;max-width:100%;box-shadow:var(--sh1)}
.jr-why{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--mint-soft)}
.jr-why .jr-i{width:38px;height:38px;border-radius:12px;background:var(--surface);color:var(--mint-ink);display:grid;place-items:center;flex:none}
.jr-why .jr-i svg{width:20px;height:20px}
.jr-why b{display:block;color:var(--mint-ink);font-weight:800;font-size:14.5px}
.jr-why span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.tgp{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#cfe3d6,#bcd6c6);max-width:420px}
:root[data-jv="dark"] .tgp{background:linear-gradient(180deg,#1d2b24,#15211b)}
.tgp-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.tgp-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#7f68ff,#5b3df5);color:#fff;display:grid;place-items:center}
.tgp-av svg{width:18px;height:18px}
.tgp-h b{display:block;font-size:14px;font-weight:800}.tgp-h small{font-size:12px;color:var(--faint)}
.tgp-b{padding:14px 14px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tgp-msg{position:relative;max-width:88%;background:#fff;color:#141413;border-radius:16px 16px 16px 6px;padding:9px 12px 18px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tgp-t{position:absolute;right:10px;bottom:4px;font-size:10.5px;color:#8a9a90}
.tgp-btn{max-width:88%;min-width:180px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);color:#2a6fb0;font-weight:700;font-size:13.5px;border-radius:12px;padding:9px 12px}
.tgp-btn svg{width:13px;height:13px}
.tgp-u{font-size:11.5px;color:#4f6357;overflow-wrap:anywhere;max-width:100%}
:root[data-jv="dark"] .tgp-msg{background:#22302a;color:#eef3ef}:root[data-jv="dark"] .tgp-u{color:#9fb6a8}

/* compare+ */
.cmode{flex-wrap:nowrap}
.ab-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 18px}
.abr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;min-width:260px}
.abr .inp{width:auto;flex:1;min-width:130px;height:42px}
.abr>span:not(.abt){color:var(--faint);font-size:13px}
.abt{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.abt.a{background:var(--brand);color:#fff}.abt.b{background:var(--ink);color:var(--bg);opacity:.75}
.fsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 20px 6px}
.fsel .sel{width:auto;max-width:240px;height:40px;border-radius:99px;font-size:13.5px}
.fsel .sel.a{border-color:var(--brand)}.fsel .sel.b{border-color:var(--ink)}
.fc{padding:10px 20px 18px;display:flex;flex-direction:column}
.fc-head,.fc-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1.4fr) minmax(0,1.4fr) 90px;gap:14px;align-items:center}
.fc-head{font-size:12.5px;font-weight:800;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.fc-head span{display:inline-flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-head .fa i,.fc-head .fb i{width:10px;height:10px;border-radius:3px;flex:none}.fc-head .fa i{background:var(--brand)}.fc-head .fb i{background:var(--ink);opacity:.6}
.fc-head .fd,.fc-row .fd{justify-self:end;text-align:right}
.fc-row{padding:12px 0;border-bottom:1px solid var(--line)}
.fc-row:last-of-type{border-bottom:0}
.fc-row .fl b{display:block;font-weight:800;font-size:14.5px}.fc-row .fl small{color:var(--faint);font-size:12px}
.fv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;min-width:0}
.fv b{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px}
.fv .drop{grid-column:1/-1;font-size:11.5px;color:var(--coral-ink);font-weight:700}
.fbar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:99px;transition:width .9s var(--ease)}
.fv.a .fbar i{background:linear-gradient(90deg,var(--brand-2),var(--brand))}.fv.b .fbar i{background:var(--ink);opacity:.55}
table.coh td.hc{background:color-mix(in srgb,var(--brand) calc(var(--h,0)*38%),var(--surface));text-align:center}
table.coh td.hc b{display:block;font-weight:800}
table.coh td.hc small{display:block;font-size:11.5px;color:var(--muted)}
table.coh td.hc.na{color:var(--faint);font-size:12px;background:repeating-linear-gradient(-45deg,var(--sunk) 0 6px,var(--surface) 6px 12px)}
table.coh th{text-align:center}table.coh th:first-child{text-align:left}

/* credits */
.cr-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:30px;color:#fff;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;
  background:radial-gradient(90% 120% at 100% 0%,#8d78ff 0%,#5b3df5 42%,#2b1a8f 100%);box-shadow:0 40px 80px -40px #5b3df5}
.cr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);background-size:250% 100%;animation:shine 6s ease-in-out infinite;pointer-events:none;z-index:-1}
.cr-copy{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:2}
.cr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cr-eb{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;opacity:.95}
.cr-eb svg{width:17px;height:17px}
.tierpill .rbadge{margin:-2px 0}
.cr-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.cr-big span{font-size:clamp(46px,7.5vw,78px);font-weight:800;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 8px 30px rgba(0,0,0,.2)}
.cr-big small{font-size:18px;font-weight:800;opacity:.85}
.cr-usd{font-size:15px;opacity:.85;font-weight:600}
.cr-note{display:flex;align-items:center;gap:7px;font-size:13px;opacity:.85;margin-top:10px}
.cr-note svg{width:15px;height:15px;flex:none}
.wallet .cr-note{margin-top:14px}
.cr-art{position:relative;height:330px;z-index:1}
.cr-art [data-depth]{transition:transform .35s var(--ease)}
.cr-glow{position:absolute;left:12%;right:6%;top:14%;bottom:4%;border-radius:50%;background:radial-gradient(circle,rgba(200,241,105,.28),transparent 62%)}
.cr-person{position:absolute;inset:0;display:grid;place-items:end center}
.cr-person svg{width:min(100%,360px);height:auto;aspect-ratio:1;filter:drop-shadow(0 30px 40px rgba(20,8,90,.45))}
.cr-person .breathe{transform-origin:260px 384px;animation:stBreathe 5.2s ease-in-out infinite}
.cr-person .headg{transform-origin:260px 216px;animation:stNod 8s ease-in-out infinite}
.cr-person .arm-l{animation:stTap .32s ease-in-out infinite alternate}.cr-person .arm-r{animation:stTap .32s ease-in-out infinite alternate-reverse}
.cr-person .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:stSway 6s ease-in-out infinite}
.cr-person .steam path{stroke-dasharray:6 40;animation:stSteam 3.2s linear infinite}
.cr-person .lidglow{transform-origin:260px 341px;animation:stLid 1.8s ease-in-out infinite}
.cr-layer{position:absolute;inset:0;pointer-events:none}
.coin2{position:absolute;left:var(--x);bottom:28%;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#6b4a00;
  background:radial-gradient(circle at 35% 30%,#fff3b8,#f2c14e 45%,#d99a12);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 8px 18px -6px rgba(0,0,0,.4);transform:scale(var(--s));opacity:0;animation:coinUp 4.8s var(--d) ease-in infinite}
@keyframes coinUp{0%{opacity:0;transform:translateY(40px) scale(var(--s)) rotateY(0)}12%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-230px) scale(var(--s)) rotateY(540deg)}}
.cr-badges{position:absolute;left:4%;top:4%;display:flex;flex-direction:column-reverse;gap:6px;align-items:flex-start}
.cr-b{opacity:.55;animation:badgeIn .8s calc(var(--i)*.12s) both var(--ease);filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.cr-b.cur{opacity:1;animation:badgeIn .8s calc(var(--i)*.12s) both var(--ease),bob 3.6s 1.2s ease-in-out infinite}
@keyframes badgeIn{from{opacity:0;transform:translateY(24px) scale(.6)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px 12px 18px;border-radius:20px;background:var(--cream);color:var(--cream-ink);font-size:14.5px}
.promo-t{display:flex;align-items:center;gap:10px}.promo-t svg{width:18px;height:18px;flex:none}.promo b{letter-spacing:.06em}
.tiers4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 20px 14px}
.tcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:18px 16px 16px;border-radius:22px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.tcard.tpop{border-color:var(--brand);background:linear-gradient(180deg,var(--lilac),var(--surface))}
.tcard em{position:absolute;top:-11px;right:14px;font-style:normal;font-size:11px;font-weight:800;background:var(--brand);color:#fff;padding:3px 9px;border-radius:99px}
.tc-usd{font-size:13px;font-weight:800;color:var(--muted)}
.tcard b{font-size:clamp(22px,2.6vw,28px);font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.tcard small{color:var(--faint);font-size:12.5px;font-weight:600}
.tc-bonus{margin-top:8px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--mint-soft);color:var(--mint-ink)}
.tc-bonus.none{background:var(--sunk);color:var(--faint)}
.rankc .card-h h2 .rbadge{margin-right:2px}
.ladder{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:18px 20px 6px}
.ladder-ln{position:absolute;left:calc(10% + 20px);right:calc(10% + 20px);top:38px;height:4px;border-radius:99px;background:var(--sunk);z-index:0}
.ladder-ln i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.rung{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;opacity:.5}
.rung.done,.rung.cur{opacity:1}
.rung .rbadge{height:40px;width:auto}
.rung b{font-size:13px;font-weight:800}.rung small{font-size:11.5px;color:var(--faint)}
.rung.cur b{color:var(--brand-text)}
.rank-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;padding:10px 20px 20px;align-items:start}
.rank-next{font-size:15px;margin-bottom:10px}
.rank-b .meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rank-b .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-2),var(--brand));transition:width 1.2s var(--ease)}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.perks li{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}
.perks li svg{width:16px;height:16px;color:var(--mint-ink);flex:none}
.perks li.lock{color:var(--faint);font-weight:500}.perks li.lock svg{color:var(--faint)}
.perks li small{font-size:12px}
.amts button{display:inline-flex;align-items:center;gap:6px}
.amt-b{font-size:11px;font-weight:800;color:var(--mint-ink);background:var(--mint-soft);padding:1px 6px;border-radius:99px}
.amts button[aria-pressed="true"] .amt-b{background:rgba(255,255,255,.2);color:inherit}
.bsum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:12px 14px;border-radius:16px;background:var(--lilac)}
.bsum span{font-size:13px;color:var(--lilac-ink);font-weight:700}
.bsum b{font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.bsum small{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.ent{display:flex;align-items:center;gap:16px;padding:20px 22px;flex-wrap:wrap;background:linear-gradient(120deg,var(--surface),var(--lilac));border-radius:24px}
.ent-i{width:48px;height:48px;border-radius:16px;background:#151513;color:#c8f169;display:grid;place-items:center;flex:none}
.ent-i svg{width:22px;height:22px}
.ent div{flex:1;min-width:220px}.ent b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}.ent span{display:block;color:var(--muted);font-size:14px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.ck{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13.5px}
.ck input{accent-color:var(--brand);width:16px;height:16px;margin:0}
.alert-con{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--sky);flex-wrap:wrap}
.alert-con .pm{border-radius:50%}
.alert-con div{flex:1;min-width:180px}.alert-con b{display:block;font-weight:800}.alert-con span{display:block;font-size:13px;color:var(--muted)}
.al-row>span:first-child{flex:1;min-width:0;color:var(--ink)!important}
.al-row b{display:block;font-size:14.5px;font-weight:700}.al-row small{display:block;font-size:12.5px;color:var(--faint);font-weight:500}
@media (max-width:1180px){.kpis.k8{grid-template-columns:repeat(4,minmax(0,1fr))}.tiers4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.cr-hero{grid-template-columns:1fr}.cr-art{height:260px;order:-1;margin:-10px -10px -20px}}
@media (max-width:700px){
  .kpis.k8{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cr-hero{padding:22px;border-radius:28px}.cr-art{height:220px}
  .cr-badges .rbadge{width:24px;height:24px}.cr-b.cur .rbadge{width:36px;height:36px}
  .tiers4{padding:12px 16px 14px;gap:10px}
  .ladder{padding:16px 10px 6px}.rung .rbadge{height:30px}.rung b{font-size:11.5px}.rung small{display:none}.ladder-ln{top:30px;left:calc(10% + 4px);right:calc(10% + 4px)}
  .rank-b{grid-template-columns:1fr;padding:10px 16px 18px}
  .fc{padding:8px 16px 16px}
  .fc-head{display:none}
  .fc-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px 12px}
