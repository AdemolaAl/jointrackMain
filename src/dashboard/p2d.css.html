<style>
/* ================= Round 17: simpler navigation, short channel cards, Channel settings, Results, More, Team, Daily report, tutorials ================= */
/* --- sub navigation: Results tabs and "‹ More" --- */
.subnav{width:100%;min-width:0;max-width:1180px;margin:0 auto;padding:6px 32px 8px}
.subnav[hidden]{display:none}
.subnav .sn-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}

.subnav .res-seg button{height:36px}
.subnav .sn-back .link{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--muted);min-height:40px;background:none;border:0;cursor:pointer;padding:0}
.subnav .sn-back .link svg{width:16px;height:16px}
.in-results #view .ph .eyebrow{display:none}
.in-results #view .view>.ph h1{font-size:22px;letter-spacing:-.03em}
.in-results #view .view>.ph p{font-size:14px}
.in-results #view .view>.ph{padding-top:0}
/* owner-only bits disappear for managers and media buyers */
.role-manager .balchip,.role-buyer .balchip,.role-manager #sidecard,.role-buyer #sidecard,.role-manager .aff-nav,.role-buyer .aff-nav{display:none!important}
/* owner-only controls the server refuses inside a team workspace: media buyers can't add or remove channels; neither role buys plans or adds link domains */
.role-buyer [data-act="add-channel"],.role-buyer [data-act="ch-rm"],.role-buyer .pop.chm hr,.role-manager .lim-card,.role-buyer .lim-card,.role-manager [data-act="lim-up"],.role-buyer [data-act="lim-up"],.role-manager [data-act="dom-sheet"],.role-buyer [data-act="dom-sheet"],.role-manager .cs-fw,.role-buyer .cs-fw{display:none!important}
/* --- workspace chip --- */
.wschip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;max-width:200px;min-width:0}
.wschip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pop.wsp .pi{align-items:center}.pop.wsp .ws-l{display:flex;flex-direction:column;min-width:0}.pop.wsp .ws-l small{color:var(--faint);font-weight:500;font-size:12px}

/* --- "Watch how" --- */
.watch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 5px;border-radius:99px;border:1px solid color-mix(in srgb,var(--brand) 22%,var(--line));background:color-mix(in srgb,var(--brand-soft) 60%,var(--surface));color:var(--brand-text);font-weight:700;font-size:13px;cursor:pointer;align-self:flex-start;transition:transform .15s var(--ease),background .15s;flex:none;max-width:100%}
.watch:hover{background:var(--brand-soft)}.watch:active{transform:scale(.97)}
.watch .w-ic{width:27px;height:27px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--brand) 70%,transparent)}
.watch .w-ic svg{width:12px;height:12px;margin-left:1px}
.watch em{font-style:normal;color:var(--faint);font-weight:600;font-size:12px}
@media (prefers-reduced-motion:no-preference){.watch .w-ic{animation:wpulse 2.6s var(--ease) infinite}}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 35%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 0%,transparent)}}
.setup .step>.watch{margin-top:-4px}
/* setup: one question per screen (extras live in Channel settings › Join method) */
.setup .jr-cv,.setup .jr-pane[data-pane="ownbk"]{display:none!important}
@media (max-width:720px){.setup .step>form>.btn.primary.lg:last-child,.setup .step>.btn.primary.lg{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 10px 26px -10px color-mix(in srgb,var(--brand) 70%,transparent)}}
/* --- shared rows --- */
.row17,.mrow17{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:0;background:var(--surface);text-align:left;cursor:pointer;color:inherit;text-decoration:none;min-height:60px}
.card.row17{border:1px solid var(--line);border-radius:20px;transition:border-color .15s,transform .15s var(--ease)}
.card.row17:hover{border-color:var(--line-2)}.row17:active,.mrow17:active{transform:scale(.99)}
.mr-ic{width:38px;height:38px;border-radius:12px;background:var(--sunk);color:var(--ink);display:grid;place-items:center;flex:none}
.mr-ic svg{width:19px;height:19px}
.mr-t{display:flex;flex-direction:column;min-width:0;flex:1}
.mr-t b{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.mr-t small{color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.mr-t small .ok{color:var(--mint-ink);font-weight:700}
.mr-go{color:var(--faint);display:grid;place-items:center;flex:none}.mr-go svg{width:17px;height:17px}
.mr-v{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
/* --- More --- */
.more17{max-width:720px}
.mgrp h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:800;margin:4px 4px 8px}
.mlist{padding:4px;border-radius:22px;overflow:hidden}
.mlist .mrow17{border-radius:16px}.mlist .mrow17:hover{background:var(--sunk)}
.mlist .mrow17+.mrow17{box-shadow:0 -1px 0 var(--line)}
.ws-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--brand) 25%,var(--line));background:var(--brand-soft);cursor:pointer;text-align:left;color:inherit;border-radius:20px;width:100%}
.ws-card .mr-ic{background:var(--surface);color:var(--brand-text)}
.more-out{color:var(--coral-ink)}
.more-foot{text-align:center;color:var(--faint);font-size:12.5px}.more-foot a{color:inherit}
/* --- Overview --- */
.ov17{gap:16px}
.ov-head{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.ov-hi{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:14.5px}
.ov-status{display:flex;align-items:center;gap:10px;font-size:clamp(18px,2.4vw,24px);font-weight:800;letter-spacing:-.03em;line-height:1.3;color:var(--ink)}
.ov-status b{color:var(--brand-text)}
.ov-status .dot{width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 20%,transparent)}

@keyframes okpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--mint) 0%,transparent)}}

.al17{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--sunk);border:1px solid var(--line);flex-wrap:wrap}
.al17 .al-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--surface)}

.al17 .al-t b{font-weight:700;font-size:14px}.al17 .al-t small{color:var(--muted);font-size:13px}
.al17.bad{background:var(--coral-soft);border-color:color-mix(in srgb,var(--coral) 25%,transparent)}.al17.bad .al-ic{color:var(--coral-ink)}
.al17.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}.al17.warn .al-ic{color:var(--amber-ink)}
.al17.ok{background:var(--mint-soft);border-color:color-mix(in srgb,var(--mint) 25%,transparent)}.al17.ok .al-ic{color:var(--mint-ink)}
.al17.soft{background:var(--sunk);border-color:var(--line)}.al17.soft .al-ic{color:var(--mint-ink)}
.big4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.big{border-radius:24px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--lilac)}

.big .bn{min-height:40px;display:flex;align-items:center}
.big .bn svg{width:24px;height:24px;color:var(--faint)}
.big .kn{font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.045em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.big .bd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);min-height:20px}
.big .bd .link{font-size:12.5px;font-weight:700;color:var(--brand-text);background:none;border:0;padding:0;cursor:pointer;text-align:left}

/* Overview: period pills + Compare months on one row (pills scroll sideways on phones), then the full KPI grid */
.ov-range{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.ov-range .filters{margin:0;min-width:0;flex:1 1 auto}
.ov-range .ov-cmp{flex:none}
.ov17 .kpis{min-width:0}
.ov17 .kpi{min-width:0}
@media (max-width:640px){
  .ov-range{flex-wrap:wrap;gap:8px}

}
.next17{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid color-mix(in srgb,var(--brand) 18%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--brand-soft) 70%,var(--surface)),var(--surface) 70%)}

.nx-eb{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-text)}

.nx-row{display:flex;gap:14px;align-items:center}
.nx-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);flex:none;box-shadow:var(--sh1);color:var(--brand-text)}
.nx-ic svg{width:22px;height:22px}.nx-ic .pm{width:44px;height:44px;border-radius:14px}
.nx-t{display:flex;flex-direction:column;min-width:0}.nx-t b{font-size:16.5px;font-weight:800;letter-spacing:-.02em}.nx-t small{color:var(--muted);font-size:14px}

.ov-low{display:flex;flex-direction:column;gap:16px;margin-top:8px}

/* --- Results --- */
.res-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.minis{display:flex;gap:8px;flex-wrap:wrap}
.minis:empty{display:none}
.mini{display:flex;flex-direction:column;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.mini small{font-size:11.5px;color:var(--faint);font-weight:700}.mini b{font-size:15px;font-weight:800}
.res-g{align-items:stretch}
.best-b{display:flex;gap:12px;align-items:center;padding:4px 18px 10px}
.best-crown{width:44px;height:44px;border-radius:14px;background:var(--mint-soft);color:var(--mint-ink);display:grid;place-items:center;flex:none}.best-crown svg{width:22px;height:22px}
.best-n{display:flex;flex-direction:column;min-width:0}.best-n b{font-size:16px;font-weight:800;overflow-wrap:anywhere}.best-n small{color:var(--muted)}
.best-l{list-style:none;margin:0;padding:0 18px 16px;display:flex;flex-direction:column;gap:6px}
.best-l li{display:flex;align-items:center;gap:10px;font-size:13.5px;min-width:0}.best-l .bl-k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best-empty{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--muted)}
.sp-b{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.sp-big b{font-size:28px;font-weight:800;letter-spacing:-.04em;display:block}.sp-big small{color:var(--muted)}
.sp-none{font-size:14px}
.metabox{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--sunk)}
.mb-h{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}.mb-h .chip{margin-left:auto}.mb-h .pm{flex:none}
.mb-t{display:flex;flex-direction:column;flex:1;min-width:160px}.mb-t b{font-weight:700;font-size:14px}.mb-t small{color:var(--muted);font-size:12.5px;line-height:1.4}
.mb-acc{display:flex;flex-direction:column;gap:6px}
.mb-a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);cursor:pointer;min-height:44px}
.mb-a input{width:18px;height:18px;accent-color:var(--brand)}.mb-a span{display:flex;flex-direction:column}.mb-a small{color:var(--faint);font-size:12px}.mb-a.off{opacity:.6}
.mb-act{display:flex;gap:8px;flex-wrap:wrap}
.mm-l{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.mm-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--surface)}
.mm-n{display:flex;flex-direction:column;flex:1;min-width:150px}.mm-n small{color:var(--faint);font-size:12px}
.mm-r .sel{max-width:100%;min-width:0;flex:0 1 200px}
.aud17{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.aud17:empty{display:none}
.au-h{display:flex;gap:12px;align-items:flex-start}
.au-ic{width:40px;height:40px;border-radius:13px;background:var(--sky);color:var(--sky-ink);display:grid;place-items:center;flex:none}.au-ic svg{width:20px;height:20px}
.au-t{display:flex;flex-direction:column;min-width:0}.au-t b{font-weight:800;font-size:15.5px;letter-spacing:-.02em}.au-t small{color:var(--muted);font-size:13.5px}
.au-bar{position:relative;height:22px;border-radius:99px;background:var(--sunk);overflow:hidden}
.au-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--sky-ink),var(--brand));opacity:.85}
.au-bar span{position:relative;z-index:1;font-size:11.5px;font-weight:800;padding:0 10px;line-height:22px;color:var(--ink)}
.au-d summary{list-style:none;cursor:pointer;font-weight:700;color:var(--brand-text);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.au-d summary::-webkit-details-marker{display:none}.au-d summary svg{width:15px;height:15px;transition:transform .2s}.au-d[open] summary svg{transform:rotate(180deg)}

.aud17.in-cs{padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
/* leaderboard */
.lb-l{display:flex;flex-direction:column;padding:0 10px 10px}

.lb-r+.lb-r{box-shadow:0 -1px 0 var(--line)}
.lb-r.top{background:var(--mint-soft)}
.lb-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800}

.lb-bar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:4px}.lb-bar i{display:block;height:100%;background:var(--c-join);border-radius:99px}

/* --- Channels --- */

.cban>svg{width:18px;height:18px;flex:none}.cban span{display:flex;flex-direction:column;flex:1;min-width:140px}.cban b{font-size:13.5px;font-weight:700}.cban small{font-size:12.5px;color:var(--muted)}
.cban.bad{background:var(--coral-soft);color:var(--coral-ink)}.cban.bad b{color:var(--coral-ink)}
.cban.warn{background:var(--amber-soft);color:var(--amber-ink);cursor:default}.cban.warn[data-act]{cursor:pointer}

.ch-add{min-height:150px}
.rows17{display:flex;flex-direction:column;gap:10px}

.cs-pl{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.cs-pl.open{border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
.cs-plh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer;color:inherit;min-height:60px}
.cs-plh .pm{flex:none}.cs-chev{color:var(--faint);transition:transform .2s;display:grid}.cs-chev svg{width:16px;height:16px}.cs-pl.open .cs-chev{transform:rotate(180deg)}
.cs-pl.soon{opacity:.6}.cs-pl.soon .cs-plh{cursor:default}
.cs-plf{display:flex;flex-direction:column;gap:14px;padding:4px 14px 16px}
.cs-sub{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--faint);margin-top:4px}
.cs-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.cs-row.col{flex-direction:column;align-items:stretch}.cs-row.col .seg{align-self:flex-start}
.cs-row.dim{opacity:.55}
.cs-form{display:flex;flex-direction:column;gap:14px}
.cs-more summary{list-style:none;cursor:pointer;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:44px}
.cs-more summary::-webkit-details-marker{display:none}.cs-more summary svg{width:15px;height:15px;transition:transform .2s}.cs-more[open] summary svg{transform:rotate(180deg)}
.cs-more>*:not(summary){margin-top:8px}
.pool-n{display:flex;align-items:center;gap:10px;flex:none}.pool-n .pt{width:70px;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.pool-n .pt i{display:block;height:100%;background:var(--mint)}
.cs-snip>details{border:0;padding:0;background:none}
.cs-snip>details>summary{display:none}
.cs-snip .bk-body{padding:0}
.dl-list{display:flex;flex-direction:column;gap:8px}
.opts17{display:flex;flex-direction:column;gap:8px}
.opt17{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;color:inherit;min-height:56px;width:100%}
.opt17[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand-soft) 50%,var(--surface))}
.o-rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:none;position:relative;transition:border-color .15s}
[aria-checked="true"]>.o-rad{border-color:var(--brand)}[aria-checked="true"]>.o-rad::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.opt17[disabled]{opacity:.6}
/* --- Team --- */
.seat17{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.st-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.st-top .mr-t{min-width:160px}
.st-bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.st-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.tm-l{display:flex;flex-direction:column;padding:0 10px 10px}
.tm-r{display:flex;align-items:center;gap:12px;padding:12px 8px}
.tm-r .ch-more{flex:none;width:40px;height:40px}
.tm-r+.tm-r{box-shadow:0 -1px 0 var(--line)}
.tm-n{display:flex;flex-direction:column;flex:1;min-width:0}.tm-n b{font-weight:700;overflow-wrap:anywhere}.tm-n small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.role-pick{display:flex;flex-direction:column;gap:8px}
.rp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:inherit;min-height:56px}
.rp[aria-checked="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand-soft) 50%,var(--surface))}
.ch-pick{display:flex;flex-wrap:wrap;gap:8px}
.cp{display:inline-flex;align-items:center;gap:8px;padding:0 14px;height:42px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;max-width:100%}
.cp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.cp:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
/* --- Daily report --- */
.rep-g{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.rep-g{grid-template-columns:minmax(0,1fr)}}
.rep-set{padding:14px;display:flex;flex-direction:column;gap:10px}
.rep-set .cs-row{border:0;background:var(--sunk)}
.rep-h{width:auto;flex:none}
.rep-tg{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--sunk)}
.rep-tg.on{background:var(--mint-soft)}.rep-tg.on .mr-ic{background:var(--surface);color:var(--mint-ink)}
.rep-links{display:flex;flex-direction:column;gap:8px}
.rep-wait{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);justify-content:center}
.rep-wait i{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:okpulse 1.4s infinite}
.rep-prev{display:flex;flex-direction:column;gap:8px}
.rep-tgp{max-width:420px}
.rep-msg{font-size:14px;line-height:1.55;white-space:normal}
/* --- Help & tutorials --- */
.tut-sec{display:flex;flex-direction:column;gap:12px}
.tut-h{padding:0}
.tut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
@media (max-width:560px){.tut-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}}
.tut-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:0;overflow:hidden;cursor:pointer;text-align:left;color:inherit;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;min-width:0}
.tut-card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--sh2)}
.tut-th{position:relative;aspect-ratio:16/10;background:radial-gradient(120% 90% at 20% 10%,#7c61ff 0%,#3a22c9 55%,#1b1340 100%);overflow:hidden;display:block}
.tut-mini{position:absolute;left:50%;top:9%;width:300px;height:560px;transform:translateX(-50%) scale(var(--ts,.32));transform-origin:top center;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),0 0 0 8px #0d0b1c;pointer-events:none}
@media (max-width:560px){.tut-mini{--ts:.26}}
.tut-play{position:absolute;left:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:#fff;color:#1b1340;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);transition:transform .2s var(--ease)}
.tut-play svg{width:16px;height:16px;margin-left:2px}.tut-card:hover .tut-play{transform:scale(1.08)}
.tut-th em{position:absolute;right:10px;bottom:12px;font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.tut-t{display:flex;flex-direction:column;padding:12px 14px 14px;gap:2px}.tut-t b{font-weight:800;font-size:14.5px;letter-spacing:-.015em;line-height:1.3}.tut-t small{color:var(--faint);font-size:12px}

/* ================= tutorial player ================= */
.tvp{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;animation:fade .2s}
.tvp.out{opacity:0;transition:opacity .2s}

.tv-stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:radial-gradient(90% 120% at 85% 20%,#3b25b8 0%,#1b1340 50%,#0d0b18 100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);user-select:none;-webkit-user-select:none}
.tv-stage::before{content:"";position:absolute;inset:auto -10% -40% 30%;height:70%;background:radial-gradient(closest-side,rgba(124,97,255,.35),transparent);pointer-events:none}
.tv-side{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 0 0 clamp(20px,5%,56px);position:relative;z-index:1}
.tv-mk{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:rgba(255,255,255,.7)}.tv-mk svg{width:22px;height:22px;background:#5b3df5;border-radius:7px;padding:3px}
.tv-h{font-size:clamp(22px,3.2vw,34px);font-weight:800;letter-spacing:-.04em;line-height:1.08}
.tv-where{color:rgba(255,255,255,.55);font-size:13.5px;font-weight:600}
.tv-chap{margin-top:8px;align-self:flex-start;font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);color:#d9d2ff}
.tv-devbox{position:relative;display:grid;place-items:center;padding:4% 0;min-height:0;z-index:1}
.tv-dev{position:relative;border-radius:calc(40px * var(--k,1));box-shadow:0 0 0 calc(7px * var(--k,1)) #050409,0 0 0 calc(8px * var(--k,1)) rgba(255,255,255,.12),0 40px 80px -20px rgba(0,0,0,.7);overflow:hidden;background:#fff}
.tv-dev .tv-vp{position:absolute;left:0;top:0;transform:scale(var(--k,1));transform-origin:0 0}
.tv-vp{display:block;width:300px;height:560px;overflow:hidden;background:#fff;color:#141413;font:500 12px/1.4 var(--f);text-align:left;letter-spacing:0}
.tv-scr{position:absolute;inset:0}
.tv-scr.in{animation:scrin .38s var(--ease);z-index:1}.tv-scr.old{z-index:0}
@keyframes scrin{from{opacity:0;transform:translateY(10px)}}
.tv-finger{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .25s}
.tv-finger.on{opacity:1}.tv-finger.jump{transition:none}
.tv-finger i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;box-shadow:0 6px 18px rgba(20,10,60,.45),0 0 0 6px rgba(124,97,255,.25)}
.tv-rip{position:absolute;left:0;top:0;z-index:4;pointer-events:none}

@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
.tv-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#1b1340;display:grid;place-items:center;cursor:pointer;box-shadow:0 18px 40px -10px rgba(0,0,0,.6);transition:opacity .25s,transform .25s var(--ease)}
.tv-big svg{width:30px;height:30px;margin-left:3px}
.tvp.playing .tv-big{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.85)}
.tv-end{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(8,6,20,.55);backdrop-filter:blur(4px);flex-wrap:wrap;padding:16px}
.tv-cap{min-height:58px;padding:10px 20px 6px;font-size:16px;line-height:1.45;font-weight:600;text-align:center;color:rgba(255,255,255,.45);text-wrap:balance}
.tv-cap span{transition:color .2s}.tv-cap span.sp{color:#fff}
.tv-ctl{display:flex;align-items:center;gap:12px;padding:6px 14px 14px}
.tv-pp{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#0d0b18;display:grid;place-items:center;cursor:pointer;flex:none}.tv-pp svg{width:18px;height:18px}
.tv-bar{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none;min-width:60px;display:flex;align-items:center}
.tv-bar:focus-visible{outline:2px solid #b9acff;border-radius:8px}
.tv-track{position:relative;width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tv-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8f7bff,#c9bfff);border-radius:99px}

.tv-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
.tv-time{font-size:12.5px;color:rgba(255,255,255,.7);white-space:nowrap;font-weight:600}
.tv-cc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.6);padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}.tv-cc svg{width:14px;height:14px}
.tv-rate{height:32px;min-width:52px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;font-weight:800;font-size:12.5px;cursor:pointer}
@media (max-width:700px){
  .tvp{padding:0;place-items:end stretch}
  .tv{width:100%;border-radius:22px 22px 0 0;max-height:100%}
  .tv-stage{aspect-ratio:auto;height:min(64vh,520px);grid-template-columns:minmax(0,1fr)}
  .tv-side{display:none}
  .tv-cap{font-size:15px;min-height:64px;padding:10px 14px 4px}

}
@media (max-width:360px){.tv-time{display:none}}
@media (prefers-reduced-motion:reduce){.tvp,.tv,.tv-scr.in,.tv-finger,.tv-rip,.tv-big,.watch .w-ic,.ov-status .dot,.rep-wait i{animation:none!important;transition:none!important}}

/* ================= mini screens inside the player (virtual 300 × 560) ================= */
